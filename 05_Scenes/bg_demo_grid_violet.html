<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SaaS Premium Animated Background - matrix-grid</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #stage {
            width: 1920px; height: 1080px;
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #0B0B14;
        }
        
        .saas-bg-container {
            position: absolute; inset: 0; overflow: hidden; background: #0B0B14;
            perspective: 600px;
        }
        .grid-plane {
            position: absolute; width: 200%; height: 200%; left: -50%; top: -20%;
            background-image: 
                linear-gradient(#8B5CF633 1.5px, transparent 1.5px),
                linear-gradient(90deg, #8B5CF633 1.5px, transparent 1.5px);
            background-size: 80px 80px;
            transform: rotateX(65deg);
            transform-origin: center center;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 15%, transparent 80%);
        }
        .horizon-glow {
            position: absolute; left: 0; right: 0; top: 40%; height: 280px;
            background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.60) 0%, transparent 75%);
            filter: blur(80px); opacity: 0.75;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="stage">
        
        <div class="saas-bg-container">
            <div class="horizon-glow"></div>
            <div class="grid-plane" id="gridPlane"></div>
        </div>
    </div>

    <script>
        const DURATION = 20;
        const tl = gsap.timeline({ paused: false });

        
        // Défilement infini de la grille 3D
        tl.to('#gridPlane', {
            backgroundPosition: '0px 800px',
            duration: 20,
            ease: 'none',
            repeat: -1
        }, 0);
        tl.to('.horizon-glow', {
            opacity: 0.95, scaleY: 1.15,
            duration: 3, repeat: -1, yoyo: true, ease: 'sine.inOut'
        }, 0);

        // Interface Timeline Studio VibeEditor
        window.__timeline = {
            duration: () => DURATION,
            seek: (t) => tl.seek(t, false),
            pause: () => tl.pause(),
            play: () => tl.play()
        };
    </script>
</body>
</html>
