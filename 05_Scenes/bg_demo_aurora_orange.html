<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SaaS Premium Animated Background - aurora</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #000;
            display: flex; align-items: center; justify-content: center;
        }
        #stage {
            width: 1920px; height: 1080px;
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #0A0A0F;
        }
        
        .saas-bg-container {
            position: absolute; inset: 0; overflow: hidden; background: #0A0A0F;
            perspective: 1000px;
        }
        .aurora-orb {
            position: absolute; border-radius: 50%; filter: blur(120px); will-change: transform;
            opacity: 0.85; pointer-events: none;
        }
        .orb-1 {
            width: 1056px; height: 1056px;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.65) 0%, transparent 70%);
            top: -15%; left: -10%;
        }
        .orb-2 {
            width: 1152px; height: 1152px;
            background: radial-gradient(circle, rgba(255, 61, 0, 0.45) 0%, transparent 70%);
            bottom: -20%; right: -15%;
        }
        .orb-3 {
            width: 864px; height: 864px;
            background: radial-gradient(circle, rgba(255, 179, 0, 0.50) 0%, transparent 70%);
            top: 40%; left: 35%;
        }
        .vignette-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.65) 100%);
            pointer-events: none;
        }
        .subtle-grid {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(255, 107, 0, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 0, 0.06) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
        }
        .grain-layer {
            position: absolute; inset: 0; opacity: 0.035; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="stage">
        
        <div class="saas-bg-container">
            <div class="subtle-grid"></div>
            <div class="aurora-orb orb-1"></div>
            <div class="aurora-orb orb-2"></div>
            <div class="aurora-orb orb-3"></div>
            <div class="vignette-overlay"></div>
            <div class="grain-layer"></div>
        </div>
    </div>

    <script>
        const DURATION = 20;
        const tl = gsap.timeline({ paused: false });

        
        // Animation continue seek-safe des orbes néons
        tl.to('.orb-1', {
            x: 230, y: 108, scale: 1.15,
            duration: 10, repeat: -1, yoyo: true, ease: 'sine.inOut'
        }, 0);
        tl.to('.orb-2', {
            x: -269, y: -130, scale: 1.20,
            duration: 12, repeat: -1, yoyo: true, ease: 'sine.inOut'
        }, 0);
        tl.to('.orb-3', {
            x: 154, y: -86, scale: 0.90,
            duration: 9, repeat: -1, yoyo: true, ease: 'sine.inOut'
        }, 0);

        // Interface Timeline Studio VibeEditor
        window.__timeline = {
            duration: () => DURATION,
            seek: (t) => tl.seek(t, false),
            pause: () => tl.pause(),
            play: () => tl.play()
        };
    </script>
</body>
</html>
