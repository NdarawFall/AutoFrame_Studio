<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Design — 2X Publish (5s Motion)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #020617;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        #stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            background: #020617;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
        }
        canvas {
            width: 1920px;
            height: 1080px;
            display: block;
        }
    </style>
</head>
<body>
    <div id="stage" data-duration="5.0">
        <canvas id="mainCanvas" width="1920" height="1080"></canvas>
    </div>

    <audio id="audioBgm" src="../01_Assets/Musiques/Wallpaper.mp3" preload="auto" loop></audio>

<script>
// ==============================================================================
// MOTEUR D'ANIMATION CANVAS 2D — REPRODUCTION EXACTE "2X PUBLISH" (5.0s)
// ==============================================================================
const canvas = document.getElementById('mainCanvas');
const g = canvas.getContext('2d');
const audioBgm = document.getElementById('audioBgm');

const DURATION = 5.0;
let isPlaying = false;
let playbackTime = 0;
let lastTimestamp = 0;
let rafId = null;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

const ease = {
    linear: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    snappy: t => 1 - Math.pow(1 - t, 4),
    spring: t => {
        const c4 = (2 * Math.PI) / 3;
        return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    },
    backOut: t => {
        const s = 1.6;
        return (t = t - 1) * t * ((s + 1) * t + s) + 1;
    }
};

// Particules d'étoiles / grain cosmique
const NOISE_STARS = [];
for (let i = 0; i < 90; i++) {
    NOISE_STARS.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        r: Math.random() * 1.8 + 0.5,
        alpha: Math.random() * 0.45 + 0.15
    });
}

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// 1. Fond Cosmique Céleste Texturé (Dégradé Bleu Profond / Cyan / Magenta)
function drawCosmicBackground(ctx, t) {
    // Dégradé diagonal principal
    const bgGrad = ctx.createLinearGradient(0, 0, 1920, 1080);
    bgGrad.addColorStop(0, '#06174a');
    bgGrad.addColorStop(0.35, '#0c2d82');
    bgGrad.addColorStop(0.7, '#1e68d7');
    bgGrad.addColorStop(1, '#3b92f6');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1920, 1080);

    // Orbe Magenta / Rose Céleste en haut à droite
    const orb1Grad = ctx.createRadialGradient(1650, 150, 50, 1650, 150, 750);
    orb1Grad.addColorStop(0, 'rgba(244, 114, 182, 0.45)');
    orb1Grad.addColorStop(0.5, 'rgba(192, 132, 252, 0.2)');
    orb1Grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = orb1Grad;
    ctx.fillRect(0, 0, 1920, 1080);

    // Orbe Cyan / Électrique en bas au centre
    const orb2Grad = ctx.createRadialGradient(960, 950, 80, 960, 950, 800);
    orb2Grad.addColorStop(0, 'rgba(56, 189, 248, 0.4)');
    orb2Grad.addColorStop(0.6, 'rgba(30, 64, 175, 0.15)');
    orb2Grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = orb2Grad;
    ctx.fillRect(0, 0, 1920, 1080);

    // Grain cosmique étoilé
    ctx.save();
    NOISE_STARS.forEach(s => {
        const twinkle = Math.sin(t * 3 + s.x) * 0.25 + 0.75;
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * twinkle})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}

function drawScene(t) {
    g.clearRect(0, 0, 1920, 1080);
    drawCosmicBackground(g, t);

    const centerX = 960;
    const centerY = 540;

    // Respiration Idle continue
    const breatheY = Math.sin(t * 2.2) * 6;
    const breatheScale = 1.0 + Math.sin(t * 2.5) * 0.01;

    // -------------------------------------------------------------------------
    // 1. LE "2X" GÉANT MONUMENTAL
    // -------------------------------------------------------------------------
    // Animation d'entrée : zoom punchy et stabilisation
    const entry2XP = ease.snappy(clamp(t / 0.9, 0, 1));
    const scale2X = lerp(0.72, 1.0, entry2XP) * breatheScale;
    const rot2X = lerp(-0.03, 0, entry2XP);

    g.save();
    g.translate(centerX, centerY + breatheY);
    g.rotate(rot2X);
    g.scale(scale2X, scale2X);

    // Ombre de profondeur sous le 2X
    ctx2X = g;
    ctx2X.font = '900 680px "Inter", -apple-system, sans-serif';
    ctx2X.textAlign = 'center';
    ctx2X.textBaseline = 'middle';
    ctx2X.letterSpacing = '-20px';

    ctx2X.shadowColor = 'rgba(2, 6, 23, 0.4)';
    ctx2X.shadowBlur = 80;
    ctx2X.shadowOffsetY = 30;

    // Dégradé soyeux sur le 2X (Blanc pur vers blanc bleuté)
    const grad2X = ctx2X.createLinearGradient(0, -340, 0, 340);
    grad2X.addColorStop(0, '#ffffff');
    grad2X.addColorStop(0.7, '#f8fafc');
    grad2X.addColorStop(1, '#e2e8f0');
    ctx2X.fillStyle = grad2X;

    ctx2X.fillText('2X', 0, 15);
    ctx2X.shadowBlur = 0;
    ctx2X.shadowOffsetY = 0;
    g.restore();

    // -------------------------------------------------------------------------
    // 2. LE BADGE / BOUTON PILULE "PUBLISH" FLOTTANT AU CENTRE
    // -------------------------------------------------------------------------
    const pillDelay = 0.5;
    const entryPillP = ease.spring(clamp((t - pillDelay) / 1.0, 0, 1));

    if (entryPillP > 0) {
        g.save();
        const pillY = centerY + breatheY + Math.sin(t * 3.0) * 4;
        g.translate(centerX, pillY);
        g.scale(entryPillP, entryPillP);

        const pillW = 460;
        const pillH = 175;
        const pillR = 44;

        // Ombre portée puissante sur le 2X
        roundRect(g, -pillW / 2, -pillH / 2, pillW, pillH, pillR);
        g.shadowColor = 'rgba(8, 28, 80, 0.6)';
        g.shadowBlur = 60;
        g.shadowOffsetY = 24;

        // Dégradé Lumineux Bleu Céleste du badge (comme sur la référence)
        const pillGrad = g.createLinearGradient(0, -pillH / 2, 0, pillH / 2);
        pillGrad.addColorStop(0, '#8ed3ff');
        pillGrad.addColorStop(0.5, '#68bfff');
        pillGrad.addColorStop(1, '#4da8fb');
        g.fillStyle = pillGrad;
        g.fill();
        g.shadowBlur = 0;
        g.shadowOffsetY = 0;

        // Liseré supérieur brillant (Specular Edge)
        g.lineWidth = 2.0;
        const edgeGrad = g.createLinearGradient(0, -pillH / 2, 0, pillH / 2);
        edgeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
        edgeGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.25)');
        edgeGrad.addColorStop(1, 'rgba(255, 255, 255, 0.05)');
        g.strokeStyle = edgeGrad;
        g.stroke();

        // Texte "Publish" en blanc pur ultra-net
        g.font = '800 74px "Inter", -apple-system, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = '#ffffff';
        g.shadowColor = 'rgba(255, 255, 255, 0.35)';
        g.shadowBlur = 20;
        g.fillText('Publish', 0, 0);
        g.shadowBlur = 0;

        g.restore();
    }

    // =========================================================================
    // RÈGLE 30 : FONDU DE FIN OBLIGATOIRE (4.2s à 5.0s)
    // =========================================================================
    if (t >= 4.2) {
        const fadeP = clamp((t - 4.2) / 0.8, 0, 1);
        g.save();
        g.fillStyle = `rgba(0, 0, 0, ${fadeP})`;
        g.fillRect(0, 0, 1920, 1080);
        g.restore();
    }
}

// ==============================================================================
// CONTRAT STUDIO VIBEEDITOR
// ==============================================================================
window.renderAt = function(timeInSeconds) {
    playbackTime = clamp(timeInSeconds, 0, DURATION);
    drawScene(playbackTime);
};

window.DURATION = DURATION;
window.duration = DURATION;
window.__timeline = {
    duration: DURATION,
    currentTime: 0,
    fps: 60,
    seek: function(t) {
        window.renderAt(t);
    }
};

window.syncAudioTimeline = function(timeInSeconds) {
    playbackTime = clamp(timeInSeconds, 0, DURATION);
    if (window.__timeline) window.__timeline.currentTime = playbackTime;

    let masterBgmVol = 0.35;
    if (playbackTime >= 4.2) {
        masterBgmVol = 0.35 * clamp((DURATION - playbackTime) / 0.8, 0, 1);
    }
    audioBgm.volume = masterBgmVol;
};

function loop(timestamp) {
    if (!isPlaying) return;

    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    playbackTime += dt;
    if (window.__timeline) window.__timeline.currentTime = playbackTime;

    let masterBgmVol = 0.35;
    if (playbackTime >= 4.2) {
        masterBgmVol = 0.35 * clamp((DURATION - playbackTime) / 0.8, 0, 1);
    }
    audioBgm.volume = masterBgmVol;

    drawScene(playbackTime);

    if (playbackTime >= DURATION) {
        pause();
        return;
    }

    rafId = requestAnimationFrame(loop);
}

function play() {
    if (isPlaying) return;
    isPlaying = true;
    lastTimestamp = 0;
    audioBgm.volume = 0.35;
    audioBgm.currentTime = playbackTime % audioBgm.duration;
    audioBgm.play().catch(() => {});
    rafId = requestAnimationFrame(loop);
}

function pause() {
    isPlaying = false;
    if (rafId) cancelAnimationFrame(rafId);
    audioBgm.pause();
}

window.play = play;
window.pause = pause;
window.seek = function(t) { window.renderAt(t); };

window.addEventListener('DOMContentLoaded', () => {
    window.renderAt(0);
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        isPlaying ? pause() : play();
    }
});
</script>
</body>
</html>
