<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>GrowKaz Stickman — La Règle des 2 Minutes (VibeEditor)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #06080c;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Nunito', sans-serif;
        }

        #stage {
            width: 1920px; height: 1080px;
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #090c12;
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
            position: absolute; inset: 0;
            z-index: 1;
        }

        /* Cinématique Letterbox 2.39:1 Scope */
        .scope-bar {
            position: absolute; left: 0; right: 0;
            background: #000;
            z-index: 10;
            pointer-events: none;
            transition: height 0.5s ease;
        }
        .scope-top { top: 0; height: 72px; }
        .scope-bot { bottom: 0; height: 72px; }

        /* Grain pellicule cinématique */
        .film-grain {
            position: absolute; inset: 0;
            opacity: 0.042;
            pointer-events: none;
            z-index: 11;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Vignette sombre */
        .vignette {
            position: absolute; inset: 0;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at 50% 50%, transparent 58%, rgba(2,4,8,0.72) 100%);
        }

        /* Flash de transition */
        #flash-overlay {
            position: absolute; inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* Badge HUD Studio */
        .hud-badge {
            position: absolute; top: 88px; left: 96px;
            z-index: 12;
            display: flex; align-items: center; gap: 12px;
            font-family: 'Fredoka', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            color: rgba(255,255,255,0.7);
            background: rgba(12,18,28,0.7);
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
        }
        .hud-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #d64a33;
            box-shadow: 0 0 10px #d64a33;
            animation: pulseDot 1.6s infinite;
        }
        @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="mainCanvas" width="1920" height="1080"></canvas>
    <div class="scope-bar scope-top"></div>
    <div class="scope-bar scope-bot"></div>
    <div class="vignette"></div>
    <div class="film-grain"></div>
    <div id="flash-overlay"></div>

    <div class="hud-badge">
        <div class="hud-dot"></div>
        <span id="hud-text">GROWKAZ STICKMAN 2D • SCÈNE 1</span>
    </div>
</div>

<script>
// ==============================================================================
// 1. MOTEUR PROCEDURAL GROWKAZ STICKMAN 2D (EMBEDDED NATIVE RUNTIME)
// ==============================================================================
const canvas = document.getElementById('mainCanvas');
const g = canvas.getContext('2d');
const flashOverlay = document.getElementById('flash-overlay');
const hudText = document.getElementById('hud-text');

// Durée globale de la vidéo : 18 secondes (4 scènes de 4.5s)
const DURATION = 18.0;

// Helper Math & Couleurs
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, k) => a + (b - a) * k;
const ease = {
    linear: x => clamp(x),
    in: x => clamp(x) ** 3,
    out: x => 1 - (1 - clamp(x)) ** 3,
    inOut: x => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2),
    outBack: x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; }
};

function rgb(c) {
    if (Array.isArray(c)) return c;
    if (c.startsWith('rgb')) { const m = c.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2], m[3] ?? 1]; }
    let h = c.slice(1); if (h.length === 3) h = [...h].map(x => x + x).join('');
    const n = parseInt(h.slice(0, 6), 16); return [n >> 16, (n >> 8) & 255, n & 255, 1];
}
const css = ([r, g, b, a = 1]) => `rgba(${r | 0},${g | 0},${b | 0},${+a.toFixed(3)})`;
const mix = (c1, c2, k) => { const a = rgb(c1), b = rgb(c2); return css(a.map((v, i) => lerp(v, b[i] ?? 1, k))); };
const alpha = (c, a) => { const x = rgb(c); return css([x[0], x[1], x[2], a]); };
const shade = (c, k) => (k < 0 ? mix(c, '#000000', -k) : mix(c, '#ffffff', k));

// Primitives Graphiques
function circle(ctx, x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function ring(ctx, x, y, r, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.stroke(); }
function seg(ctx, pts, w, col, cap = 'round') {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = cap; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
}
function poly(ctx, pts, fill) {
    ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
}
function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glow(ctx, x, y, r, col, a = 1) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, alpha(col, a));
    gr.addColorStop(0.35, alpha(col, a * 0.35));
    gr.addColorStop(1, alpha(col, 0));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

// ------------------------------------------------------------------------------
// 2. POSES DU SQUELETTE STICKMAN (RIG 2D)
// ------------------------------------------------------------------------------
const POSES = {
    stand:      { head: [3, -208], sh: [0, -174], hip: [0, -100], eF: [9, -137], hF: [13, -101], eB: [-7, -136], hB: [-9, -100], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
    sad:        { head: [12, -192], sh: [6, -166], hip: [0, -100], eF: [10, -132], hF: [12, -98], eB: [-2, -132], hB: [-2, -98], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
    facepalm:   { head: [8, -200], sh: [2, -170], hip: [0, -100], eF: [28, -160], hF: [26, -200], eB: [-7, -136], hB: [-9, -100], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
    think:      { head: [6, -206], sh: [1, -173], hip: [0, -100], eF: [24, -148], hF: [16, -192], eB: [16, -134], hB: [6, -140], kF: [6, -50], fF: [3, 0], kB: [-6, -50], fB: [-11, 0] },
    point:      { head: [5, -208], sh: [1, -174], hip: [0, -100], eF: [34, -170], hF: [68, -172], eB: [-7, -136], hB: [-9, -100], kF: [6, -50], fF: [6, 0], kB: [-6, -50], fB: [-12, 0] },
    push:       { head: [22, -195], sh: [16, -162], hip: [0, -96], eF: [48, -164], hF: [76, -165], eB: [36, -158], hB: [66, -155], kF: [26, -48], fF: [34, 0], kB: [-24, -48], fB: [-28, 0] },
    ready:      { head: [12, -182], sh: [6, -148], hip: [0, -80], eF: [34, -132], hF: [56, -146], eB: [-26, -132], hB: [-46, -146], kF: [26, -44], fF: [22, 0], kB: [-24, -44], fB: [-24, 0] },
    cheer:      { head: [3, -212], sh: [0, -176], hip: [0, -100], eF: [22, -206], hF: [36, -246], eB: [-20, -206], hB: [-32, -246], kF: [10, -50], fF: [16, 0], kB: [-10, -50], fB: [-16, 0] }
};

function mixVal(a, b, k) {
    if (typeof a === 'number') return lerp(a, b, k);
    if (Array.isArray(a)) return a.map((v, i) => mixVal(v, b[i], k));
    const o = {}; for (const kk in a) o[kk] = mixVal(a[kk], b[kk] ?? a[kk], k); return o;
}
function blendPose(p1, p2, k) { return mixVal(p1, p2, ease.inOut(k)); }

function breathe(p, t, amt = 1) {
    const b = Math.sin(t * 2.2) * 1.8 * amt;
    const s = Math.sin(t * 1.1) * 1.2 * amt;
    const q = { ...p };
    for (const k of ['head', 'sh', 'eF', 'hF', 'eB', 'hB']) {
        q[k] = [p[k][0] + s * (k === 'head' ? 1.2 : 0.6), p[k][1] + b];
    }
    return q;
}

function ik(a, b, L1, L2, dir = 1) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    let d = Math.hypot(dx, dy); d = Math.min(d, L1 + L2 - 0.01);
    const ang = Math.atan2(dy, dx) - dir * Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    return [a[0] + Math.cos(ang) * L1, a[1] + Math.sin(ang) * L1];
}

function walkPose(phase, run = false) {
    const st = run ? 46 : 28, li = run ? 34 : 14, bb = run ? 7 : 3, ar = run ? 30 : 18, le = run ? 14 : 3;
    const hipY = -100 + (run ? 6 : 0) - bb * (1 - Math.abs(Math.sin(phase))) + bb * 0.5;
    const hip = [0, hipY], sh = [le, hipY - 74], head = [le + 4, hipY - 108];
    const foot = (ph) => [st * Math.sin(ph), -li * Math.max(0, Math.cos(ph))];
    const fF = foot(phase), fB = foot(phase + Math.PI);
    const kF = ik(hip, fF, 52, 52, 1), kB = ik(hip, fB, 52, 52, 1);
    const hand = (ph) => run ? [le + ar * Math.sin(ph) * 0.9 + 6, hipY - 46 - Math.cos(ph) * 10] : [le * 0.5 - ar * Math.sin(ph) + 4, hipY - 2];
    const hF = hand(phase + Math.PI), hB = hand(phase);
    const elbow = (h) => run ? [lerp(sh[0], h[0], 0.5) - 14, lerp(sh[1], h[1], 0.5) + 6] : [lerp(sh[0], h[0], 0.5) - 3, sh[1] + 38];
    return { head, sh, hip, eF: elbow(hF), hF, eB: elbow(hB), hB, kF, fF, kB, fB };
}

// ------------------------------------------------------------------------------
// 3. VISAGE & EXPRESSIONS MINIMALES GROWKAZ
// ------------------------------------------------------------------------------
function drawFace(ctx, hx, hy, r, expr = 'neutral', blink = false) {
    const fx = hx + r * 0.32, fy = hy - r * 0.08;
    const eyeX = [fx - r * 0.26, fx + r * 0.32];
    const ey = fy - r * 0.08;
    const col = '#ffffff', ink = '#0c0e14';

    ctx.save();
    eyeX.forEach(x => {
        if (blink || expr === 'sad') {
            seg(ctx, [[x - r * 0.1, ey], [x + r * 0.1, ey]], r * 0.09, col);
        } else if (expr === 'determined') {
            circle(ctx, x + 2, ey, r * 0.12, col);
            circle(ctx, x + 3, ey, r * 0.06, '#00ff9d'); // Regard émeraude déterminé
        } else {
            circle(ctx, x, ey, r * 0.12, col);
        }
    });

    const by = ey - r * 0.28, bw = r * 0.14;
    if (expr === 'sad' || expr === 'worried') {
        seg(ctx, [[eyeX[0] - bw, by - 2], [eyeX[0] + bw, by + 4]], r * 0.08, col);
        seg(ctx, [[eyeX[1] - bw, by + 4], [eyeX[1] + bw, by - 2]], r * 0.08, col);
    } else if (expr === 'determined') {
        seg(ctx, [[eyeX[0] - bw, by + 4], [eyeX[0] + bw, by - 2]], r * 0.09, col);
        seg(ctx, [[eyeX[1] - bw, by - 2], [eyeX[1] + bw, by + 4]], r * 0.09, col);
    }

    const mx = fx + r * 0.04, my = fy + r * 0.42;
    if (expr === 'sad') {
        ctx.strokeStyle = col; ctx.lineWidth = r * 0.09; ctx.beginPath();
        ctx.arc(mx, my + r * 0.18, r * 0.2, Math.PI + 0.4, Math.PI * 2 - 0.4); ctx.stroke();
    } else if (expr === 'grin' || expr === 'happy') {
        ctx.fillStyle = col; ctx.beginPath();
        ctx.moveTo(mx - r * 0.25, my - r * 0.05); ctx.quadraticCurveTo(mx, my + r * 0.35, mx + r * 0.25, my - r * 0.05);
        ctx.closePath(); ctx.fill();
    } else {
        seg(ctx, [[mx - r * 0.14, my], [mx + r * 0.14, my]], r * 0.09, col);
    }
    ctx.restore();
}

// ------------------------------------------------------------------------------
// 4. CORPS & RIM LIGHT DU PERSONNAGE (DRAW FIGURE)
// ------------------------------------------------------------------------------
function drawFigure(ctx, o) {
    const { x, y, s = 1, facing = 1, pose = POSES.stand, outfit = {}, expr = 'neutral', blink = false, trail = 0 } = o;
    const ink = '#0a0d13', inkFar = '#1c2230';
    const rimCol = o.rimColor || '#ffc68a';
    const hoodieCol = outfit.color || '#d64a33';

    // Ombre de contact au sol
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 36 * s, 8 * s, 0, 0, Math.PI * 2);
    ctx.fill();

    // Effet Trail (Afterimage de vitesse)
    if (trail > 0) {
        for (let i = trail; i >= 1; i--) {
            ctx.save();
            ctx.globalAlpha = 0.24 * (1 - i / (trail + 1));
            renderRig(ctx, x - i * 36 * facing, y, s, facing, pose, hoodieCol, '#00ff9d', ink, inkFar, expr, blink);
            ctx.restore();
        }
    }

    // Dessin principal avec Rim Light
    renderRig(ctx, x, y, s, facing, pose, hoodieCol, rimCol, ink, inkFar, expr, blink);
}

function renderRig(ctx, x, y, s, facing, p, hoodieCol, rimCol, ink, inkFar, expr, blink) {
    // Passe 1 : Rim Light décalée
    ctx.save();
    ctx.translate(x - 4 * facing, y - 3);
    ctx.scale(facing * s, s);
    drawSkeleton(ctx, p, rimCol, rimCol, rimCol, true);
    ctx.restore();

    // Passe 2 : Corps principal silhouette encrée
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * s, s);
    drawSkeleton(ctx, p, ink, inkFar, hoodieCol, false, expr, blink);
    ctx.restore();
}

function drawSkeleton(ctx, p, ink, far, hoodieCol, isRim, expr, blink) {
    const L = 13, A = 11, T = 15, HR = 26;

    // Membre lointain (bras & jambe)
    seg(ctx, [p.hip, p.kB, p.fB, [p.fB[0] + 12, p.fB[1]]], L - 1, far);
    seg(ctx, [p.sh, p.eB, p.hB], A - 1, far);

    // Torse (Hoodie)
    seg(ctx, [p.sh, p.hip], T, ink);
    if (!isRim) {
        // Vêtement signature : Hoodie
        ctx.fillStyle = hoodieCol;
        ctx.beginPath();
        ctx.moveTo(p.sh[0] - 15, p.sh[1] - 3);
        ctx.quadraticCurveTo(p.sh[0], p.sh[1] - 10, p.sh[0] + 15, p.sh[1] - 3);
        ctx.lineTo(p.hip[0] + 15, p.hip[1] + 8);
        ctx.lineTo(p.hip[0] - 15, p.hip[1] + 8);
        ctx.closePath(); ctx.fill();
        // Cordon du hoodie
        seg(ctx, [[p.sh[0] + 6, p.sh[1] + 4], [p.sh[0] + 7, p.sh[1] + 24]], 2.2, '#ffffff');
    } else {
        ctx.fillStyle = ink;
        ctx.fillRect(p.hip[0] - 15, p.sh[1] - 3, 30, (p.hip[1] - p.sh[1]) + 11);
    }

    // Membre proche (bras & jambe)
    seg(ctx, [p.hip, p.kF, p.fF, [p.fF[0] + 13, p.fF[1]]], L, ink);
    seg(ctx, [p.sh, p.eF, p.hF], A, ink);

    // Tête
    circle(ctx, p.head[0], p.head[1], HR, ink);

    // Visage (uniquement en passe principale)
    if (!isRim) {
        drawFace(ctx, p.head[0], p.head[1], HR, expr, blink);
    }
}

// ------------------------------------------------------------------------------
// 5. GIANT FACE CLOSE-UP (SCÈNE 2)
// ------------------------------------------------------------------------------
function drawBigFace(ctx, cx, cy, r, expr = 'determined', rimCol = '#00ff9d') {
    ctx.save();
    ctx.translate(cx, cy);

    // Épaules
    ctx.fillStyle = '#d64a33';
    ctx.beginPath();
    ctx.ellipse(0, r * 1.62, r * 1.25, r * 0.85, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    // Croissant Rim Light néon
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r + 7, 0, Math.PI * 2);
    ctx.arc(-14, 0, r, 0, Math.PI * 2, true);
    ctx.fillStyle = rimCol;
    ctx.fill('evenodd');
    ctx.restore();

    // Tête noire
    circle(ctx, 0, 0, r, '#0a0d13');

    // Visage gros plan
    drawFace(ctx, -r * 0.1, -r * 0.05, r * 0.95, expr, false);

    ctx.restore();
}

// Particules ambiantes
const dustParticles = Array.from({ length: 48 }, (_, i) => ({
    x: (i * 41) % 1920,
    y: (i * 73) % 1080,
    r: 1.5 + (i % 3) * 1.2,
    speed: 0.3 + (i % 5) * 0.2,
    alpha: 0.2 + (i % 4) * 0.15
}));

// ==============================================================================
// 6. CHORÉGRAPHIE GLOBALE DES 4 SCÈNES
// ==============================================================================
function renderAt(t) {
    g.clearRect(0, 0, 1920, 1080);

    // ── SCÈNE 1 (0.0s -> 4.5s) : L'ÉCRASEMENT DE LA PROCRASTINATION ──
    if (t < 4.5) {
        hudText.textContent = "GROWKAZ STICKMAN 2D • SCÈNE 1 : L'INERTIE";
        const progress = t / 4.5;

        // Décor moody sombre
        const bgGrad = g.createLinearGradient(0, 0, 0, 1080);
        bgGrad.addColorStop(0, '#0a0d14');
        bgGrad.addColorStop(1, '#05070a');
        g.fillStyle = bgGrad; g.fillRect(0, 0, 1920, 1080);

        // Fenêtre avec lumière rasante
        g.fillStyle = 'rgba(255, 198, 138, 0.06)';
        g.beginPath();
        g.moveTo(200, 140); g.lineTo(700, 140); g.lineTo(950, 1080); g.lineTo(0, 1080);
        g.closePath(); g.fill();

        // Bureau & Ordinateur
        g.fillStyle = '#141822';
        g.fillRect(800, 780, 520, 18); // Table
        g.fillRect(840, 798, 20, 282); // Pied
        g.fillRect(1260, 798, 20, 282);

        // Lampe de bureau avec cône de lumière
        g.fillStyle = '#ffc68a';
        circle(g, 1260, 640, 14, '#ffc68a');
        glow(g, 1260, 640, 160, '#ffc68a', 0.4);

        // Cartes flottantes intimidantes (Emails, Tâches, Deadline)
        const floatY = Math.sin(t * 2) * 12;
        const cards = [
            { txt: "37 EMAILS NON LUS", x: 380, y: 320 + floatY, col: '#ff5c5c', w: 320 },
            { txt: "PROJET NON COMMENCÉ", x: 440, y: 440 - floatY, col: '#e67e22', w: 360 },
            { txt: "DEADLINE : DEMAIN 8H", x: 340, y: 560 + floatY * 0.8, col: '#ff3b30', w: 340 }
        ];

        cards.forEach((c, idx) => {
            const appear = clamp((t - idx * 0.3) / 0.5);
            g.save();
            g.globalAlpha = appear;
            g.translate(c.x, c.y);
            g.fillStyle = 'rgba(20,24,34,0.85)';
            rr(g, 0, 0, c.w, 64, 12); g.fill();
            g.strokeStyle = alpha(c.col, 0.6); g.lineWidth = 2; g.stroke();

            // Puce d'alerte
            circle(g, 28, 32, 8, c.col);
            g.fillStyle = '#ffffff';
            g.font = '800 20px "Nunito"';
            g.fillText(c.txt, 52, 39);
            g.restore();
        });

        // Personnage MAX affalé / fatigué
        const pose1 = blendPose(POSES.sad, POSES.facepalm, clamp((t - 1.2) / 1.0));
        const breathing = breathe(pose1, t, 1);
        drawFigure(g, {
            x: 980, y: 780,
            s: 1.25, facing: -1,
            pose: breathing,
            outfit: { color: '#d64a33' },
            expr: 'sad',
            rimColor: '#ffc68a',
            blink: (t % 3) > 2.8
        });

        // Titre cinématique percutant
        const titleAlpha = clamp((t - 0.4) / 0.8);
        g.save();
        g.globalAlpha = titleAlpha;
        g.font = '900 56px "Fredoka", sans-serif';
        g.fillStyle = '#ffffff';
        g.textAlign = 'center';
        g.fillText("99% DES GENS ABANDONNENT ICI", 960, 220);
        g.font = '700 24px "Nunito"';
        g.fillStyle = '#ffc68a';
        g.fillText("LE POIDS DE L'INERTIE EST PSYCHOLOGIQUE", 960, 264);
        g.restore();
    }

    // ── SCÈNE 2 (4.5s -> 9.0s) : TIME-FREEZE & LE BLUEPRINT 120s ──
    else if (t < 9.0) {
        hudText.textContent = "GROWKAZ STICKMAN 2D • SCÈNE 2 : LE PROTOCOLE BLUEPRINT";
        const tSc = t - 4.5;

        // Flash blanc au déclenchement (4.5s -> 4.8s)
        if (tSc < 0.3) {
            flashOverlay.style.opacity = (1 - tSc / 0.3) * 0.9;
        } else {
            flashOverlay.style.opacity = 0;
        }

        // Fond Blueprint Technique
        g.fillStyle = '#071322';
        g.fillRect(0, 0, 1920, 1080);

        // Grille Blueprint fine
        g.strokeStyle = 'rgba(74, 158, 255, 0.12)';
        g.lineWidth = 1;
        for (let x = 0; x < 1920; x += 60) {
            g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1080); g.stroke();
        }
        for (let y = 0; y < 1080; y += 60) {
            g.beginPath(); g.moveTo(0, y); g.lineTo(1920, y); g.stroke();
        }

        // Cadre de mesure technique HUD
        g.strokeStyle = 'rgba(74, 158, 255, 0.35)';
        g.lineWidth = 2;
        rr(g, 100, 100, 1720, 880, 16); g.stroke();

        // Giant Face Close-up à gauche (réflexion & détermination)
        const faceExpr = tSc > 1.8 ? 'determined' : 'worried';
        const rimColor = tSc > 1.8 ? '#00ff9d' : '#4a9eff';
        drawBigFace(g, 540, 560, 220, faceExpr, rimColor);

        // Scanner HUD & Cible à droite : LA RÈGLE DES 2 MINUTES
        const cx = 1320, cy = 540;

        // Cadran circulaire animé
        const angle = (tSc * 1.8) % (Math.PI * 2);
        ring(g, cx, cy, 180, 4, 'rgba(74, 158, 255, 0.25)');
        ring(g, cx, cy, 195, 2, 'rgba(74, 158, 255, 0.15)');

        // Arc de progression dynamique
        g.strokeStyle = '#00ff9d';
        g.lineWidth = 8;
        g.beginPath();
        g.arc(cx, cy, 180, -Math.PI / 2, -Math.PI / 2 + (tSc / 4.5) * Math.PI * 2);
        ctx = g; g.stroke();
        glow(g, cx, cy, 220, '#00ff9d', 0.2);

        // Décompte 02:00
        const secRemaining = Math.max(0, 120 - Math.floor(tSc * 24));
        const mins = String(Math.floor(secRemaining / 60)).padStart(2, '0');
        const secs = String(secRemaining % 60).padStart(2, '0');

        g.fillStyle = '#ffffff';
        g.font = '900 84px "Fredoka", sans-serif';
        g.textAlign = 'center';
        g.fillText(`${mins}:${secs}`, cx, cy + 24);

        g.font = '800 24px "Nunito"';
        g.fillStyle = '#00ff9d';
        g.fillText("SEUIL D'ACTIVATION NEURONALE", cx, cy - 80);

        g.font = '700 20px "Nunito"';
        g.fillStyle = 'rgba(255,255,255,0.7)';
        g.fillText("LE CERVEAU NE REJETTE PAS 120 SECONDES", cx, cy + 90);

        // Badges d'instructions en bas
        g.fillStyle = 'rgba(74, 158, 255, 0.15)';
        rr(g, cx - 260, cy + 140, 520, 56, 12); g.fill();
        g.strokeStyle = '#4a9eff'; g.lineWidth = 1.5; g.stroke();
        g.fillStyle = '#ffffff';
        g.font = '800 18px "Nunito"';
        g.fillText("PROTOCOLE : JUSTE COMMENCER. RIEN DE PLUS.", cx, cy + 175);
    }

    // ── SCÈNE 3 (9.0s -> 13.5s) : L'ÉLAN & L'EFFET DOMINO EN ACTION ──
    else if (t < 13.5) {
        hudText.textContent = "GROWKAZ STICKMAN 2D • SCÈNE 3 : L'ÉNERGIE CINÉTIQUE";
        const tSc = t - 9.0;

        // Ambiance Émeraude high-tech
        const bgGrad = g.createLinearGradient(0, 0, 0, 1080);
        bgGrad.addColorStop(0, '#061612');
        bgGrad.addColorStop(1, '#020b08');
        g.fillStyle = bgGrad; g.fillRect(0, 0, 1920, 1080);

        // Sol néon émeraude
        g.strokeStyle = 'rgba(0, 255, 157, 0.15)';
        g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, 820); g.lineTo(1920, 820); g.stroke();
        glow(g, 960, 820, 400, '#00ff9d', 0.12);

        // Course et poussée du Stickman (MAX)
        const charX = lerp(260, 680, ease.out(clamp(tSc / 1.8)));
        const isPushing = tSc > 1.8;
        const walkPhase = tSc * Math.PI * 4;
        const currentPose = isPushing ? POSES.push : walkPose(walkPhase, true);

        drawFigure(g, {
            x: charX, y: 820,
            s: 1.3, facing: 1,
            pose: currentPose,
            outfit: { color: '#d64a33' },
            expr: 'determined',
            rimColor: '#00ff9d',
            trail: isPushing ? 0 : 3
        });

        // Les 3 Dominos géants qui tombent en cascade
        const dominos = [
            { x: 860, w: 42, h: 220, fallStart: 1.9, angleMax: 0.95 },
            { x: 1140, w: 58, h: 320, fallStart: 2.3, angleMax: 0.90 },
            { x: 1480, w: 76, h: 440, fallStart: 2.8, angleMax: 0.85 }
        ];

        dominos.forEach((d, idx) => {
            const fallProg = clamp((tSc - d.fallStart) / 0.6);
            const rot = ease.in(fallProg) * d.angleMax;

            g.save();
            g.translate(d.x, 820);
            g.rotate(rot);

            // Corps du domino
            g.fillStyle = idx === 0 ? '#00ff9d' : (idx === 1 ? '#00ccff' : '#ffc68a');
            rr(g, 0, -d.h, d.w, d.h, 10); g.fill();

            // Lueur d'impact quand il tombe
            if (fallProg > 0.85) {
                glow(g, d.w / 2, -d.h / 2, 120, idx === 0 ? '#00ff9d' : '#00ccff', 0.5);
            }
            g.restore();
        });

        // Onde de choc énergétique
        if (tSc > 2.0) {
            const waveR = (tSc - 2.0) * 480;
            ring(g, 860, 820, waveR, 3, alpha('#00ff9d', clamp(1 - (tSc - 2.0) / 2.0)));
        }

        // Titre cinématique
        g.fillStyle = '#ffffff';
        g.font = '900 58px "Fredoka", sans-serif';
        g.textAlign = 'center';
        g.fillText("2 MINUTES BRISENT TOUTE L'INERTIE", 960, 200);

        g.font = '800 24px "Nunito"';
        g.fillStyle = '#00ff9d';
        g.fillText("L'ÉLAN DÉCLENCHE UN EFFET EN CHAÎNE IRREVERSIBLE", 960, 250);
    }

    // ── SCÈNE 4 (13.5s -> 18.0s) : LE SOMMET & VICTOIRE (ROOFTOP SUNRISE) ──
    else {
        hudText.textContent = "GROWKAZ STICKMAN 2D • SCÈNE 4 : LA VICTOIRE";
        const tSc = t - 13.5;

        // Lever de soleil cinématique doré
        const skyGrad = g.createLinearGradient(0, 0, 0, 1080);
        skyGrad.addColorStop(0, '#100c1c');
        skyGrad.addColorStop(0.5, '#2e1428');
        skyGrad.addColorStop(0.85, '#a4422e');
        skyGrad.addColorStop(1, '#ffaa5c');
        g.fillStyle = skyGrad; g.fillRect(0, 0, 1920, 1080);

        // Soleil immense & Rayons
        circle(g, 960, 720, 180, '#ffe8b5');
        glow(g, 960, 720, 600, '#ffaa5c', 0.6);

        // Skyline de gratte-ciels en contre-jour (silhouette)
        g.fillStyle = '#09080e';
        const buildings = [
            [60, 520, 140, 560], [220, 440, 180, 640], [420, 580, 120, 500],
            [1380, 480, 160, 600], [1560, 390, 180, 690], [1760, 540, 120, 540]
        ];
        buildings.forEach(([bx, by, bw, bh]) => {
            g.fillRect(bx, by, bw, bh);
            // Quelques fenêtres allumées
            for (let fy = by + 30; fy < 1000; fy += 40) {
                for (let fx = bx + 20; fx < bx + bw - 20; fx += 30) {
                    if ((fx + fy) % 5 === 0) {
                        g.fillStyle = 'rgba(255, 220, 160, 0.45)';
                        g.fillRect(fx, fy, 12, 18);
                    }
                }
            }
            g.fillStyle = '#09080e';
        });

        // Plateforme Rooftop centrale
        g.fillStyle = '#050408';
        g.beginPath();
        g.moveTo(700, 1080); g.lineTo(820, 780); g.lineTo(1100, 780); g.lineTo(1220, 1080);
        g.closePath(); g.fill();

        // MAX debout au sommet en pose triomphante
        const cheerPose = blendPose(POSES.stand, POSES.cheer, clamp(tSc / 1.0));
        drawFigure(g, {
            x: 960, y: 780,
            s: 1.4, facing: 1,
            pose: breathe(cheerPose, t, 1),
            outfit: { color: '#d64a33' },
            expr: 'grin',
            rimColor: '#ffe8b5'
        });

        // Titre final et Call To Action
        g.fillStyle = '#ffffff';
        g.font = '900 68px "Fredoka", sans-serif';
        g.textAlign = 'center';
        g.fillText("COMMENCE PETIT. DOMINE TOUT.", 960, 260);

        g.font = '800 28px "Nunito"';
        g.fillStyle = '#ffe8b5';
        g.fillText("2 MINUTES AUJOURD'HUI. TON EMPIRE DEMAIN.", 960, 316);

        // Bouton d'action / Abonnement style GrowKaz
        const pillScale = ease.outBack(clamp((tSc - 1.2) / 0.6));
        g.save();
        g.translate(960, 390);
        g.scale(pillScale, pillScale);
        g.fillStyle = '#d64a33';
        rr(g, -170, -28, 340, 56, 28); g.fill();
        g.fillStyle = '#ffffff';
        g.font = '900 20px "Nunito"';
        g.fillText("ABONNE-TOI POUR PLUS DE HACKS", 0, 7);
        g.restore();
    }

    // Particules de poussière dorée flottantes permanentes
    dustParticles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = 1080;
        circle(g, p.x, p.y, p.r, `rgba(255, 230, 180, ${p.alpha})`);
    });
}

// ==============================================================================
// 7. LIAISON TIMELINE GSAP & CONTRAT STUDIO VIBEEDITOR
// ==============================================================================
const tl = gsap.timeline({
    paused: false,
    defaults: { ease: 'none' },
    onUpdate: () => renderAt(tl.time())
});

tl.to({}, { duration: DURATION });

// Boucle standard si lecture autonome dans un navigateur
function animLoop() {
    if (tl.isActive()) {
        renderAt(tl.time());
    }
    requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);

// Contrat universel d'intégration VibeEditor Studio Player & Render Engine Chrome CDP
window.__timeline = {
    duration: () => DURATION,
    seek: (t, suppress = false) => {
        tl.seek(t, suppress);
        renderAt(t);
    },
    pause: () => tl.pause(),
    play: () => tl.play(),
    currentTime: () => tl.time()
};
</script>
</body>
</html>
