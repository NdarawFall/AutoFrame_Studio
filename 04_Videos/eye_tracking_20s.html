<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Œil Réaliste — PING</title>
    <!-- GSAP 3.12 Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- STAGE 1920x1080 AUTOSCALÉ --- */
        #stage-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #stage {
            width: 1920px;
            height: 1080px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            overflow: hidden;
        }

        /* ==========================================================================
           TEXT ANIMATION STYLES
           ========================================================================== */
        #main-text-wrapper {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            z-index: 100;
            pointer-events: none;
            text-align: center;
        }
        .animated-text {
            position: absolute;
            width: 100%;
            left: 0;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 80px;
            color: #1a1a1a;
            letter-spacing: -2px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(40px);
        }

        /* ==========================================================================
           1. FAISCEAU DIRECTIONNEL (ŒIL -> OBJET CIBLÉ)
           ========================================================================== */
        #light-beam-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            mix-blend-mode: multiply;
        }

        /* ==========================================================================
           2. CONTENEUR DE L'ŒIL RÉALISTE (OUVERT DÈS LE DÉPART)
           ========================================================================== */
        #eye-container {
            position: absolute;
            left: 960px;
            top: 400px;
            transform: translate(-50%, -50%);
            width: 440px;
            height: 240px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #eye-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* ==========================================================================
           3. OBJETS MOBILES (Boules colorées qui bougent)
           ========================================================================== */
        .moving-object {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 20;
            transform-origin: center center;
            opacity: 0;
        }

        /* Légende bas d'écran */
        #bottom-caption {
            position: absolute;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 800;
            color: rgba(26, 26, 26, 0.35);
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 35;
            pointer-events: none;
        }
    </style>
    <script>
        window.VIDEO_CONFIG = {
            duration: 20.0,
            fps: 60,
            format: '16:9',
            width: 1920,
            height: 1080
        };
    </script>
</head>
<body>
    <!-- commentaire test -->
    <div id="stage-container">
        <div id="stage" data-duration="20.0" data-width="1920" data-height="1080">

            <!-- ANIMATED TEXT OVERLAY -->
            <div id="main-text-wrapper">
                <div class="animated-text" id="txt-1">salut</div>
                <div class="animated-text" id="txt-2">Détection multi-cibles</div>
                <div class="animated-text" id="txt-3">Traitement temps réel</div>
                <div class="animated-text" id="txt-4">Système optimisé</div>
            </div>

            <!-- 1. FAISCEAU DIRECTIONNEL -->
            <svg id="light-beam-svg" viewBox="0 0 1920 1080">
                <defs>
                    <linearGradient id="beamGrad" x1="960" y1="400" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#2f6fdb" stop-opacity="0.35" />
                        <stop offset="50%" stop-color="#2f6fdb" stop-opacity="0.12" />
                        <stop offset="100%" stop-color="#2f6fdb" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
                <polygon id="beamPolygon" points="960,400 960,400 960,400" fill="url(#beamGrad)" opacity="0" />
            </svg>

            <!-- 2. ŒIL RÉALISTE -->
            <div id="eye-container">
                <svg id="eye-svg" viewBox="-220 -130 440 260">
                    <defs>
                        <radialGradient id="scleraGrad" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="60%" stop-color="#e8e8e8" />
                            <stop offset="85%" stop-color="#d0d0d0" />
                            <stop offset="100%" stop-color="#b0b0b0" />
                        </radialGradient>
                        <radialGradient id="irisGrad" cx="35%" cy="35%" r="65%">
                            <stop offset="0%" stop-color="#8b6914" />
                            <stop offset="35%" stop-color="#6b4f0d" />
                            <stop offset="70%" stop-color="#4a3508" />
                            <stop offset="90%" stop-color="#2d1f04" />
                            <stop offset="100%" stop-color="#1a1002" />
                        </radialGradient>
                        <linearGradient id="orbitalBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="rgba(0,0,0,0.15)" />
                            <stop offset="50%" stop-color="rgba(0,0,0,0.3)" />
                            <stop offset="100%" stop-color="rgba(0,0,0,0.15)" />
                        </linearGradient>
                        <clipPath id="eyeOpeningClip">
                            <path id="eyeOpeningPath" d="M -175,0 Q 0,-95 175,0 Q 0,95 -175,0 Z" />
                        </clipPath>
                        <radialGradient id="catchlightGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                            <stop offset="65%" stop-color="#ffffff" stop-opacity="0.8" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </radialGradient>
                        <filter id="eyeShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
                        </filter>
                    </defs>
                    <path id="eyeSocketBase" d="M -175,0 Q 0,-95 175,0 Q 0,95 -175,0 Z" fill="url(#scleraGrad)" stroke="url(#orbitalBorderGrad)" stroke-width="2" filter="url(#eyeShadow)" />
                    <path d="M -175,0 Q -166,-6 -158,0 Q -166,6 -175,0 Z" fill="rgba(200, 100, 100, 0.3)" />
                    <g clip-path="url(#eyeOpeningClip)" id="eyeballLayer">
                        <rect x="-220" y="-130" width="440" height="260" fill="url(#scleraGrad)" />
                        <path d="M -160,0 Q -100,-8 -70,2" stroke="rgba(200, 50, 50, 0.18)" stroke-width="1.6" fill="none" />
                        <path d="M 160,0 Q 100,-6 70,3" stroke="rgba(200, 50, 50, 0.18)" stroke-width="1.6" fill="none" />
                        <g id="eyeGazeGroup">
                            <circle id="irisCircle" cx="0" cy="0" r="62" fill="url(#irisGrad)" stroke="#2d1f04" stroke-width="3.5" />
                            <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(139, 105, 20, 0.3)" stroke-width="1.5" stroke-dasharray="4 3" />
                            <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(107, 79, 13, 0.4)" stroke-width="1.2" stroke-dasharray="3 4" />
                            <circle cx="0" cy="0" r="34" fill="none" stroke="rgba(74, 53, 8, 0.5)" stroke-width="1.8" />
                            <circle id="pupilCircle" cx="0" cy="0" r="26" fill="#030712" />
                            <circle id="catchlight" cx="-14" cy="-14" r="9" fill="url(#catchlightGrad)" />
                            <circle cx="12" cy="12" r="3.5" fill="#ffffff" opacity="0.65" />
                        </g>
                        <path d="M -175,0 Q 0,-95 175,0 Q 0,-45 -175,0 Z" fill="rgba(20, 20, 20, 0.35)" />
                    </g>
                    <path id="eyelidBorder" d="M -175,0 Q 0,-95 175,0 Q 0,95 -175,0 Z" fill="none" stroke="rgba(0, 0, 0, 0.35)" stroke-width="2.5" stroke-linecap="round" />
                    <path id="eyelashLineUpper" d="M -155,-18 Q 0,-100 155,-18" fill="none" stroke="rgba(120, 120, 120, 0.5)" stroke-width="2" stroke-dasharray="3 4" />
                    <path id="eyelidCrease" d="M -145,-15 Q 0,-45 145,-15" fill="none" stroke="rgba(0, 0, 0, 0.25)" stroke-width="1.8" stroke-linecap="round" />
                </svg>
            </div>

            <!-- 3. OBJETS MOBILES -->
            <div id="objects-container"></div>

            <!-- Légende épurée bas d'écran -->
            <div id="bottom-caption">PING • SUIVI OCULAIRE • DÉTECTION DE TRAJECTOIRE</div>

        </div>
    </div>

    <script>
        // Démarrage de la configuration GSAP et de la timeline
        const DURATION = 20.0;
        const isIframeMode = window.self !== window.top;

        function scaleStage() {
            const container = document.getElementById('stage-container');
            const stage = document.getElementById('stage');
            const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        scaleStage();

        const objectContainer = document.getElementById('objects-container');
        const objectsData = [];

        const OBJECT_COLORS = [
            { main: '#2f6fdb', light: '#60a5fa', glow: 'rgba(47, 111, 219, 0.4)' },
            { main: '#e11d48', light: '#fb7185', glow: 'rgba(225, 29, 72, 0.4)' },
            { main: '#0d9488', light: '#2dd4bf', glow: 'rgba(13, 148, 136, 0.4)' },
            { main: '#d97706', light: '#fbbf24', glow: 'rgba(217, 119, 6, 0.4)' },
            { main: '#7c3aed', light: '#c084fc', glow: 'rgba(124, 58, 237, 0.4)' },
            { main: '#dc2626', light: '#ef4444', glow: 'rgba(220, 38, 38, 0.4)' },
        ];

        const TRAJECTORIES = [
            { x: 200, y: 200, vx: 1.2, vy: 0.8, delay: 0.5, size: 35 },
            { x: 1720, y: 180, vx: -1.0, vy: 1.1, delay: 1.2, size: 40 },
            { x: 180, y: 900, vx: 1.3, vy: -0.7, delay: 2.0, size: 30 },
            { x: 1740, y: 880, vx: -1.1, vy: -1.0, delay: 2.8, size: 38 },
            { x: 960, y: 120, vx: 0.5, vy: 1.4, delay: 3.5, size: 42 },
            { x: 960, y: 960, vx: -0.6, vy: -1.3, delay: 4.2, size: 33 },
        ];

        function createObjectElements() {
            TRAJECTORIES.forEach((traj, i) => {
                const color = OBJECT_COLORS[i % OBJECT_COLORS.length];
                const el = document.createElement('div');
                el.className = 'moving-object';
                el.id = `obj-${i}`;
                el.style.cssText = `
                    left: ${traj.x}px;
                    top: ${traj.y}px;
                    width: ${traj.size * 2}px;
                    height: ${traj.size * 2}px;
                    background: radial-gradient(circle at 30% 30%, ${color.light} 0%, ${color.main} 60%, ${color.main} 100%);
                    box-shadow: 0 8px 24px ${color.glow}, inset 0 -4px 12px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.3);
                    border: 2px solid rgba(255,255,255,0.4);
                    z-index: 20;
                `;
                const ring = document.createElement('div');
                ring.className = 'focus-ring';
                ring.style.cssText = `position: absolute; inset: -8px; border-radius: 50%; border: 3px solid ${color.main}; opacity: 0; pointer-events: none; box-shadow: 0 0 20px ${color.glow}, 0 0 40px ${color.glow}; transform: scale(0.8);`;
                el.appendChild(ring);
                const label = document.createElement('div');
                label.style.cssText = `position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; color: ${color.main}; white-space: nowrap; opacity: 0.7;`;
                label.textContent = `OBJ-${i + 1}`;
                el.appendChild(label);
                objectContainer.appendChild(el);
                objectsData.push({ el, ring, label, color, x: traj.x, y: traj.y, vx: traj.vx, vy: traj.vy, baseSize: traj.size, currentSize: traj.size, targetSize: traj.size, isFocused: false, focusProgress: 0, delay: traj.delay, appeared: false, trajectoryChangeTimes: [], lastDirectionChange: 0 });
            });
        }

        const beamState = { x2: 960, y2: 400, x3: 960, y3: 400, opacity: 0, targetObj: null };

        function updateBeam() {
            const poly = document.getElementById('beamPolygon');
            if (poly) {
                poly.setAttribute('points', `960,400 ${beamState.x2},${beamState.y2} ${beamState.x3},${beamState.y3}`);
                poly.style.opacity = beamState.opacity;
            }
        }

        const tl = gsap.timeline({ paused: isIframeMode, onUpdate: updateBeam });
        window.tl = tl;
        window.timeline = tl;

        const PATH_OPEN = "M -175,0 Q 0,-95 175,0 Q 0,95 -175,0 Z";
        const PATH_CLOSED = "M -175,0 Q 0,22 175,0 Q 0,22 -175,0 Z";
        const PATH_SQUINT = "M -175,0 Q 0,-48 175,0 Q 0,55 -175,0 Z";

        gsap.set(['#eyeOpeningPath', '#eyelidBorder'], { attr: { d: PATH_OPEN } });
        gsap.set('#eyelashLineUpper', { opacity: 1 });
        gsap.set('#eyelidCrease', { opacity: 1, y: 0 });
        gsap.set('#eyeGazeGroup', { x: 0, y: 0 });
        gsap.set('#pupilCircle', { attr: { r: 26 } });
        gsap.set('#eyeSocketBase', { opacity: 1 });
        gsap.set(beamState, { opacity: 0, targetObj: null });
        updateBeam();

        createObjectElements();

        function showObject(objData, time) {
            tl.fromTo(objData.el, { opacity: 0, scale: 0.3, rotation: -15 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(1.7)' }, time);
            objData.appeared = true;
        }

        function lookAtObject(objData, time, duration = 0.5) {
            const targetX = objData.x - 960;
            const targetY = objData.y - 400;
            const maxGaze = 55;
            const dist = Math.sqrt(targetX * targetX + targetY * targetY);
            const factor = Math.min(1, dist / 600) * maxGaze;
            const gazeX = targetX * factor / (dist || 1);
            const gazeY = targetY * factor / (dist || 1);

            tl.to('#eyeGazeGroup', { x: gazeX, y: gazeY, duration: duration, ease: 'power3.out' }, time);
            const targetPupil = dist < 300 ? 32 : 22;
            tl.to('#pupilCircle', { attr: { r: targetPupil }, duration: duration * 0.7, ease: 'power2.out' }, time + 0.05);
            tl.call(() => { beamState.targetObj = objData; }, null, time);
            tl.to(beamState, { x2: objData.x, y2: objData.y, x3: objData.x + (objData.x - 960) * 0.3, y3: objData.y + (objData.y - 400) * 0.3, opacity: 0.28, duration: duration, ease: 'power3.out' }, time);
            tl.to(objData.ring, { opacity: 1, scale: 1, duration: 0.3, ease: 'power2.out' }, time + 0.1);
            tl.to(objData.el, { borderColor: objData.color.main, boxShadow: `0 8px 24px ${objData.color.glow}, inset 0 -4px 12px rgba(0,0,0,0.15), 0 0 30px ${objData.color.glow}`, duration: 0.3, ease: 'power2.out' }, time + 0.1);
            objData.isFocused = true;
        }

        function unfocusObject(objData, time) {
            if (!objData.isFocused) return;
            tl.to(objData.ring, { opacity: 0, scale: 0.8, duration: 0.25, ease: 'power2.in' }, time);
            tl.to(objData.el, { borderColor: 'rgba(255,255,255,0.4)', boxShadow: `0 8px 24px ${objData.color.glow}, inset 0 -4px 12px rgba(0,0,0,0.15), inset 0 4px 8px rgba(255,255,255,0.3)`, duration: 0.3, ease: 'power2.in' }, time);
            objData.isFocused = false;
        }

        function blink(time, closeDur = 0.1, openDur = 0.14, delay = 0) {
            const t = time + delay;
            tl.to(['#eyeOpeningPath', '#eyelidBorder'], { attr: { d: PATH_CLOSED }, duration: closeDur, ease: 'power2.in' }, t);
            tl.to('#eyelashLineUpper', { opacity: 0, duration: closeDur * 0.8 }, t);
            tl.to('#eyelidCrease', { opacity: 0.4, y: 6, duration: closeDur }, t);
            tl.to(['#eyeOpeningPath', '#eyelidBorder'], { attr: { d: PATH_OPEN }, duration: openDur, ease: 'power2.out' }, t + closeDur);
            tl.to('#eyelashLineUpper', { opacity: 1, duration: openDur * 0.7 }, t + closeDur + 0.02);
            tl.to('#eyelidCrease', { opacity: 1, y: 0, duration: openDur }, t + closeDur);
        }

        function changeTrajectory(objData, newVx, newVy, time) {
            objData.vx = newVx;
            objData.vy = newVy;
            objData.trajectoryChangeTimes.push(time);
            objData.lastDirectionChange = time;
            tl.to(objData.el, { scale: 1.3, duration: 0.15, ease: 'power2.out' }, time);
            tl.to(objData.el, { scale: 1, duration: 0.35, ease: 'back.out(2)' }, time + 0.15);
            tl.to(objData.ring, { opacity: 1, scale: 1.5, duration: 0.1, ease: 'power2.out' }, time);
            tl.to(objData.ring, { opacity: objData.isFocused ? 1 : 0, scale: 1, duration: 0.3, ease: 'power2.out' }, time + 0.1);
        }

        // ======================================================================
        // ANIMATION DU TEXTE
        // ======================================================================
        tl.to('#txt-1', { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 0.5);
        tl.to('#txt-1', { opacity: 0, y: -40, duration: 0.6, ease: "power4.in" }, 4.5);

        tl.to('#txt-2', { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 5.5);
        tl.to('#txt-2', { opacity: 0, y: -40, duration: 0.6, ease: "power4.in" }, 11.5);

        tl.to('#txt-3', { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 12.5);
        tl.to('#txt-3', { opacity: 0, y: -40, duration: 0.6, ease: "power4.in" }, 15.5);

        tl.to('#txt-4', { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" }, 16.5);
        tl.to('#txt-4', { opacity: 0, duration: 0.8 }, 19.0);

        // ======================================================================
        // TIMELINE SEQUENCE
        // ======================================================================
        blink(0.8);
        showObject(objectsData[0], 1.0);
        showObject(objectsData[1], 1.6);
        showObject(objectsData[2], 2.2);
        lookAtObject(objectsData[0], 2.5, 0.6);
        tl.call(() => unfocusObject(objectsData[0], 4.0), null, 4.0);
        lookAtObject(objectsData[1], 4.1, 0.55);
        changeTrajectory(objectsData[0], -1.4, 1.2, 4.8);
        tl.call(() => unfocusObject(objectsData[1], 4.9), null, 4.9);
        lookAtObject(objectsData[0], 5.0, 0.4);

        blink(5.5);
        showObject(objectsData[3], 5.8);
        showObject(objectsData[4], 6.4);
        showObject(objectsData[5], 7.0);
        tl.call(() => unfocusObject(objectsData[0], 7.2), null, 7.2);
        lookAtObject(objectsData[2], 7.3, 0.5);
        changeTrajectory(objectsData[3], 1.5, -0.5, 8.0);
        tl.call(() => unfocusObject(objectsData[2], 8.1), null, 8.1);
        lookAtObject(objectsData[3], 8.2, 0.4);
        changeTrajectory(objectsData[1], -0.8, -1.3, 9.0);
        tl.call(() => unfocusObject(objectsData[3], 9.1), null, 9.1);
        lookAtObject(objectsData[1], 9.2, 0.4);
        blink(9.5);
        changeTrajectory(objectsData[4], -1.2, 0.8, 10.0);
        tl.call(() => unfocusObject(objectsData[1], 10.1), null, 10.1);
        lookAtObject(objectsData[4], 10.2, 0.4);
        changeTrajectory(objectsData[5], 1.0, -1.1, 10.8);
        tl.call(() => unfocusObject(objectsData[4], 10.9), null, 10.9);
        lookAtObject(objectsData[5], 11.0, 0.4);

        blink(11.8);
        const quickSequence = [
            { obj: 0, time: 12.2, vx: 1.5, vy: -0.3 },
            { obj: 2, time: 12.9, vx: -1.2, vy: 1.4 },
            { obj: 4, time: 13.6, vx: 0.8, vy: -1.5 },
            { obj: 1, time: 14.3, vx: 1.3, vy: 0.6 },
            { obj: 5, time: 15.0, vx: -1.4, vy: 0.9 },
            { obj: 3, time: 15.7, vx: 0.5, vy: 1.2 },
        ];
        quickSequence.forEach((seq, i) => {
            const obj = objectsData[seq.obj];
            changeTrajectory(obj, seq.vx, seq.vy, seq.time);
            const prevObj = i > 0 ? objectsData[quickSequence[i-1].obj] : null;
            if (prevObj) tl.call(() => unfocusObject(prevObj, seq.time + 0.1), null, seq.time + 0.1);
            lookAtObject(obj, seq.time + 0.15, 0.35);
        });

        blink(16.2);
        tl.call(() => { objectsData.forEach(o => unfocusObject(o, 16.5)); }, null, 16.5);
        tl.to('#eyeGazeGroup', { x: 0, y: 0, duration: 0.7, ease: 'power2.inOut' }, 16.8);
        tl.to('#pupilCircle', { attr: { r: 26 }, duration: 0.5, ease: 'power2.out' }, 16.8);
        tl.to(beamState, { opacity: 0, duration: 0.6, ease: 'power2.out' }, 16.8);
        tl.to(objectsData.map(o => o.el), { y: '+=20', duration: 1.5, repeat: 1, yoyo: true, ease: 'sine.inOut', stagger: 0.1 }, 17.5);
        blink(18.5);
        tl.to(['#eyeOpeningPath', '#eyelidBorder'], { attr: { d: PATH_CLOSED }, duration: 0.7, ease: 'power2.inOut' }, 19.0);
        tl.to('#eyelashLineUpper', { opacity: 0, duration: 0.4 }, 19.0);
        tl.to('#eyelidCrease', { opacity: 0, y: 8, duration: 0.6, ease: 'power2.in' }, 19.0);
        tl.to(['#eyeSocketBase', '#objects-container', '#bottom-caption'], { opacity: 0, duration: 0.8, ease: 'power2.in' }, 19.2);

        let lastFrameTime = 0;
        const MARGIN = 60;
        function animateObjects(frameTime) {
            const dt = (frameTime - lastFrameTime) / 1000;
            lastFrameTime = frameTime;
            if (dt > 0.1) return;
            objectsData.forEach(obj => {
                if (!obj.appeared) return;
                obj.x += obj.vx * dt * 120;
                obj.y += obj.vy * dt * 120;
                if (obj.x < MARGIN + obj.baseSize) { obj.x = MARGIN + obj.baseSize; obj.vx *= -1; }
                else if (obj.x > 1920 - MARGIN - obj.baseSize) { obj.x = 1920 - MARGIN - obj.baseSize; obj.vx *= -1; }
                if (obj.y < MARGIN + obj.baseSize) { obj.y = MARGIN + obj.baseSize; obj.vy *= -1; }
                else if (obj.y > 1080 - MARGIN - obj.baseSize) { obj.y = 1080 - MARGIN - obj.baseSize; obj.vy *= -1; }
                obj.el.style.left = `${obj.x - obj.baseSize}px`;
                obj.el.style.top = `${obj.y - obj.baseSize}px`;
            });
            if (beamState.targetObj && beamState.opacity > 0.01) {
                const obj = beamState.targetObj;
                beamState.x2 = obj.x; beamState.y2 = obj.y;
                beamState.x3 = obj.x + (obj.x - 960) * 0.3; beamState.y3 = obj.y + (obj.y - 400) * 0.3;
            }
        }
        gsap.ticker.add(animateObjects);

        window.__timeline = {
            duration: () => DURATION,
            seek: (time) => { tl.seek(time, false); updateBeam(); },
            pause: () => { tl.pause(); gsap.ticker.remove(animateObjects); updateBeam(); },
            play: () => { tl.play(); gsap.ticker.add(animateObjects); }
        };

        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data) return;
            if (data.type === 'seek') {
                const targetTime = (data.time !== undefined) ? data.time : (data.progress !== undefined ? data.progress * DURATION : 0);
                window.__timeline.seek(targetTime);
            } else if (data.type === 'play') { window.__timeline.play(); }
            else if (data.type === 'pause') { window.__timeline.pause(); }
        });
    </script>
