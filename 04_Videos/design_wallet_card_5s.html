<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Design — Wallet Card to 2X Publish (Seamless Camera Transition 10s)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body {
            width: 100%;

            background: #eef0f4;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            -webkit-font-smoothing: antialiased;
        }
        #stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            background: #eef0f4;
            overflow: hidden;

        }
        canvas {
            width: 1920px;
            height: 1080px;
            display: block;
        }
    </style>
</head>
<body>
    <div id="stage" data-duration="10.0">
        <canvas id="mainCanvas" width="1920" height="1080"></canvas>
    </div>

    <audio id="audioBgm" src="../01_Assets/Musiques/Wallpaper.mp3" preload="auto" loop></audio>

<script>
// ==============================================================================
// MOTEUR D'ANIMATION CANVAS 2D — TRAVELLING CAMÉRA LE LONG DE LA LIGNE ÉPAISSE
// Scène 1 : Wallet Card  ➔  Travelling le long de la ligne  ➔  Scène 2 : 2X Publish
// ==============================================================================
const canvas = document.getElementById('mainCanvas');
const g = canvas.getContext('2d');
const audioBgm = document.getElementById('audioBgm');

const DURATION = 10.0;
let isPlaying = false;
let playbackTime = 0;
let lastTimestamp = 0;
let rafId = null;

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

const ease = {
    linear: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    snappy: t => 1 - Math.pow(1 - t, 4),
    inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    spring: t => {
        const c4 = (2 * Math.PI) / 3;
        return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    },
    smoothStep: t => t * t * (3 - 2 * t)
};

function roundRect(ctx, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

// -----------------------------------------------------------------------------
// DÉFINITION DE LA GRANDE LIGNE ÉPAISSE QUI RELIE LES DEUX MONDES
// Coordonnées de l'espace mondial (World Space) :
// Scène 1 est centrée en (960, 540)
// Scène 2 est centrée en (3400, 1800)
// -----------------------------------------------------------------------------
function getWavePoint(s, t) {
    // Ligne directrice diagonale de (-400, -200) à (4400, 2400)
    const x0 = -400, y0 = -200;
    const x1 = 4400, y1 = 2400;

    const angle = Math.atan2(y1 - y0, x1 - x0);
    const nx = -Math.sin(angle);
    const ny = Math.cos(angle);

    const bx = lerp(x0, x1, s);
    const by = lerp(y0, y1, s);

    // Ondulations harmoniques
    const wave1 = Math.sin(s * Math.PI * 5.0 - t * 2.5) * 130;
    const wave2 = Math.sin(s * Math.PI * 9.0 + t * 1.5) * 45;
    const offset = wave1 + wave2;

    return {
        x: bx + nx * offset,
        y: by + ny * offset,
        nx: nx,
        ny: ny
    };
}

// Rendu de la grosse ligne épaisse (#1c1c22)
function drawThickWaveLine(ctx, t) {
    ctx.save();
    const totalPoints = 380;

    ctx.beginPath();
    for (let i = 0; i <= totalPoints; i++) {
        const s = i / totalPoints;
        const pt = getWavePoint(s, t);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // GROSSE LIGNE ÉPAISSE : 56px de largeur !
    ctx.lineWidth = 56;

    // Ombre 3D tactile profonde
    ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 24;
    ctx.strokeStyle = '#1c1c22';
    ctx.stroke();

    // Liseré supérieur subtil pour donner un volume 3D tubulaire
    ctx.lineWidth = 6;
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.stroke();

    ctx.restore();
}

// -----------------------------------------------------------------------------
// SCÈNE 1 : BANK BALANCE CARD (CENTRE 960, 540)
// -----------------------------------------------------------------------------
function drawWalletCardScene(ctx, t) {
    const cardEntryP = ease.spring(clamp(t / 1.0, 0, 1));
    const cardScale = lerp(0.85, 1.0, cardEntryP);
    const cardY = 540;

    const mainW = 580;
    const mainH = 680;
    const mainR = 56;

    ctx.save();
    ctx.translate(960, cardY);
    ctx.scale(cardScale, cardScale);

    // Ombre d'élévation
    roundRect(ctx, -mainW / 2, -mainH / 2, mainW, mainH, mainR);
    ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
    ctx.shadowBlur = 65;
    ctx.shadowOffsetY = 30;
    ctx.fillStyle = '#1c1c22';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;

    // Bordure
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.stroke();

    ctx.save();
    roundRect(ctx, -mainW / 2, -mainH / 2, mainW, mainH, mainR);
    ctx.clip();

    // En-tête
    ctx.font = '600 24px "Inter", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f3f4f6';
    ctx.fillText('Bank Balance', -mainW / 2 + 46, -mainH / 2 + 65);

    // Badge "Active"
    const pillW = 96;
    const pillH = 34;
    const pillX = mainW / 2 - 46 - pillW;
    const pillY = -mainH / 2 + 65 - pillH / 2;
    roundRect(ctx, pillX, pillY, pillW, pillH, 17);
    ctx.fillStyle = 'rgba(34, 197, 94, 0.14)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(34, 197, 94, 0.3)';
    ctx.stroke();

    ctx.font = '700 14px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ade80';
    ctx.fillText('Active', pillX + pillW / 2, -mainH / 2 + 65);

    // Solde Roulant Dynamique
    const countP = ease.smoothStep(clamp((t - 0.2) / 1.5, 0, 1));
    const targetAmount = 22677.45;
    const currentVal = (targetAmount * countP).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

    ctx.font = '800 66px "Inter", sans-serif';
    ctx.textAlign = 'left';
    ctx.letterSpacing = '-2px';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`$${currentVal}`, -mainW / 2 + 44, -mainH / 2 + 175);

    // Cartes VISA superposées
    const subCardW = 460;
    const subCardH = 140;
    const subCardR = 28;

    // Carte 1
    const card1Delay = 0.6;
    const card1P = ease.spring(clamp((t - card1Delay) / 1.0, 0, 1));
    const card1Y = lerp(mainH / 2 + 50, mainH / 2 - 210, card1P);

    if (card1P > 0) {
        ctx.save();
        ctx.translate(0, card1Y);
        roundRect(ctx, -subCardW / 2, -subCardH / 2, subCardW, subCardH, subCardR);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 30;
        ctx.shadowOffsetY = 12;

        const c1Grad = ctx.createLinearGradient(0, -subCardH / 2, 0, subCardH / 2);
        c1Grad.addColorStop(0, '#564bec');
        c1Grad.addColorStop(1, '#6b61f8');
        ctx.fillStyle = c1Grad;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.stroke();

        ctx.font = '700 24px "Inter", monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('**** 5432', -subCardW / 2 + 36, -subCardH / 2 + 45);

        ctx.font = 'italic 900 28px "Inter", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('VISA', subCardW / 2 - 36, -subCardH / 2 + 45);
        ctx.restore();
    }

    // Carte 2
    const card2Delay = 0.9;
    const card2P = ease.spring(clamp((t - card2Delay) / 1.0, 0, 1));
    const card2Y = lerp(mainH / 2 + 80, mainH / 2 - 95, card2P);

    if (card2P > 0) {
        ctx.save();
        ctx.translate(0, card2Y);
        roundRect(ctx, -subCardW / 2, -subCardH / 2, subCardW, subCardH, subCardR);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 10;

        const c2Grad = ctx.createLinearGradient(0, -subCardH / 2, 0, subCardH / 2);
        c2Grad.addColorStop(0, '#a993fa');
        c2Grad.addColorStop(1, '#beaafc');
        ctx.fillStyle = c2Grad;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.stroke();

        ctx.font = '700 24px "Inter", monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('**** 8774', -subCardW / 2 + 36, 0);

        ctx.font = 'italic 900 28px "Inter", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText('VISA', subCardW / 2 - 36, 0);
        ctx.restore();
    }

    ctx.restore();
    ctx.restore();
}

// Particules d'étoiles / grain cosmique pour la Scène 2
const SCENE2_STARS = [];
for (let i = 0; i < 90; i++) {
    SCENE2_STARS.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        r: Math.random() * 1.8 + 0.5,
        alpha: Math.random() * 0.45 + 0.15
    });
}

// -----------------------------------------------------------------------------
// SCÈNE 2 : DESIGN HAUT DE GAMME "2X PUBLISH" (RÉFÉRENCE EXACTE 1)
// Centre mondial : (3400, 1800)
// -----------------------------------------------------------------------------
function drawScene2GrowthStation(ctx, t) {
    const s2T = t - 5.0; // commence à être visible pendant le travelling
    if (s2T < -1.5) return;

    ctx.save();
    ctx.translate(3400, 1800);

    const breatheY = Math.sin(t * 2.2) * 5;
    const breatheScale = 1.0 + Math.sin(t * 2.5) * 0.008;

    // Badge d'en-tête supérieur
    const headerP = ease.snappy(clamp((s2T - 0.2) / 0.8, 0, 1));
    if (headerP > 0) {
        ctx.save();
        ctx.translate(0, -380 + breatheY);
        ctx.scale(headerP, headerP);

        const hW = 320;
        const hH = 36;
        roundRect(ctx, -hW / 2, -hH / 2, hW, hH, 18);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.stroke();

        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('• SCALE YOUR OUTPUT & REACH', 0, 0);
        ctx.restore();
    }

    // 1. LE "2X" GÉANT MONUMENTAL (Typographie titanesque blanche ultra-nette)
    const scale2XP = ease.snappy(clamp(s2T / 1.0, 0, 1));
    const s2X = lerp(0.78, 1.0, scale2XP) * breatheScale;
    const rot2X = lerp(-0.02, 0, scale2XP);

    ctx.save();
    ctx.translate(0, breatheY);
    ctx.rotate(rot2X);
    ctx.scale(s2X, s2X);

    ctx.font = '900 680px "Inter", -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.letterSpacing = '-22px';

    // Ombre de profondeur sous le 2X
    ctx.shadowColor = 'rgba(2, 6, 23, 0.45)';
    ctx.shadowBlur = 85;
    ctx.shadowOffsetY = 32;

    // Dégradé soyeux sur le 2X (Blanc pur vers blanc perlé bleuté)
    const grad2X = ctx.createLinearGradient(0, -340, 0, 340);
    grad2X.addColorStop(0, '#ffffff');
    grad2X.addColorStop(0.7, '#f8fafc');
    grad2X.addColorStop(1, '#e2e8f0');
    ctx.fillStyle = grad2X;
    ctx.fillText('2X', 0, 15);

    // RESET OBLIGATOIRE DES OMBRES POUR ÉVITER LES OMBRES FANTÔMES
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.restore();

    // 2. LE BADGE BOUTON PILULE "PUBLISH" FLOTTANT AU CENTRE DU 2X
    const pillDelay = 0.4;
    const pillP = ease.spring(clamp((s2T - pillDelay) / 1.0, 0, 1));
    if (pillP > 0) {
        ctx.save();
        const pY = breatheY + Math.sin(t * 3.0) * 4;
        ctx.translate(0, pY);
        ctx.scale(pillP, pillP);

        const pillW = 460;
        const pillH = 175;
        const pillR = 44;

        // Ombre portée puissante sur le 2X
        roundRect(ctx, -pillW / 2, -pillH / 2, pillW, pillH, pillR);
        ctx.shadowColor = 'rgba(8, 28, 80, 0.65)';
        ctx.shadowBlur = 65;
        ctx.shadowOffsetY = 24;

        // Dégradé Lumineux Bleu Céleste du badge (comme sur la référence 1)
        const pillGrad = ctx.createLinearGradient(0, -pillH / 2, 0, pillH / 2);
        pillGrad.addColorStop(0, '#8ed3ff');
        pillGrad.addColorStop(0.5, '#68bfff');
        pillGrad.addColorStop(1, '#4da8fb');
        ctx.fillStyle = pillGrad;
        ctx.fill();

        // Réinitialisation de l'ombre immédiatement après le fill
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        // Liseré supérieur brillant (Specular Edge)
        ctx.lineWidth = 2.0;
        const edgeGrad = ctx.createLinearGradient(0, -pillH / 2, 0, pillH / 2);
        edgeGrad.addColorStop(0, 'rgba(255, 255, 255, 0.90)');
        edgeGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.30)');
        edgeGrad.addColorStop(1, 'rgba(255, 255, 255, 0.08)');
        ctx.strokeStyle = edgeGrad;
        ctx.stroke();

        // Texte "Publish" en blanc pur ultra-net (sans ombre parasite)
        ctx.font = '800 74px "Inter", -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Publish', 0, 0);

        ctx.restore();
    }

    // 3. SOUS-LABEL DE PERFORMANCE ÉLÉGANT
    const subP = ease.snappy(clamp((s2T - 0.6) / 0.8, 0, 1));
    if (subP > 0) {
        ctx.save();
        ctx.translate(0, 390 + breatheY);
        ctx.scale(subP, subP);

        ctx.font = '600 24px "Inter", sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 15;
        ctx.fillText('Doublez votre rythme de publication sans friction.', 0, 0);
        ctx.restore();
    }

    ctx.restore();
}

// -----------------------------------------------------------------------------
// GRILLE DE FOND AVEC EFFET FONDU (RADIAL VIGNETTE FADE)
// -----------------------------------------------------------------------------
let cachedGridCanvas = null;

function getCachedGridCanvas() {
    if (cachedGridCanvas) return cachedGridCanvas;
    
    const w = 1920;
    const h = 1080;
    const cellSize = 60;
    
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    const octx = off.getContext('2d');
    
    // 1. Tracer la grille géométrique épurée
    octx.strokeStyle = 'rgba(28, 28, 34, 0.18)';
    octx.lineWidth = 1.2;
    
    // Lignes verticales
    for (let x = 0; x <= w; x += cellSize) {
        octx.beginPath();
        octx.moveTo(x, 0);
        octx.lineTo(x, h);
        octx.stroke();
    }
    // Lignes horizontales
    for (let y = 0; y <= h; y += cellSize) {
        octx.beginPath();
        octx.moveTo(0, y);
        octx.lineTo(w, y);
        octx.stroke();
    }
    
    // Petites croix d'intersection subtiles aux croisements
    octx.fillStyle = 'rgba(28, 28, 34, 0.35)';
    for (let x = 0; x <= w; x += cellSize) {
        for (let y = 0; y <= h; y += cellSize) {
            octx.fillRect(x - 2, y - 2, 4, 4);
        }
    }
    
    // 2. Masque de fondu radial (effet fondu : centre bien visible, disparition fluide vers l'extérieur)
    octx.globalCompositeOperation = 'destination-in';
    const radMask = octx.createRadialGradient(w / 2, h / 2, 100, w / 2, h / 2, 920);
    radMask.addColorStop(0, 'rgba(0, 0, 0, 0.95)');
    radMask.addColorStop(0.40, 'rgba(0, 0, 0, 0.70)');
    radMask.addColorStop(0.75, 'rgba(0, 0, 0, 0.25)');
    radMask.addColorStop(1, 'rgba(0, 0, 0, 0)');
    octx.fillStyle = radMask;
    octx.fillRect(0, 0, w, h);
    
    cachedGridCanvas = off;
    return cachedGridCanvas;
}

function drawFadedGrid(ctx, t) {
    ctx.save();
    const grid = getCachedGridCanvas();
    // Respiration organique subtile de la grille
    ctx.globalAlpha = 0.88 + 0.12 * Math.sin(t * 1.5);
    ctx.drawImage(grid, 0, 0);
    ctx.restore();
}

// -----------------------------------------------------------------------------
// ÉTOILE TOURNANTE DE COIN (FLOUE, SANS ÉTOILE BLANCHE INTÉRIEURE)
// -----------------------------------------------------------------------------
function drawCornerStar(ctx, cx, cy, rOuter, rInner, rotation) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    // FLOU CINÉMATIQUE (Depth of Field bokeh blur)
    ctx.filter = 'blur(14px)';

    // Étoile moderne à 4 branches concaves (forme pure unie sombre)
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        const a1 = (i * Math.PI) / 2;
        const a2 = ((i + 1) * Math.PI) / 2;
        const amid = a1 + Math.PI / 4;

        const x1 = Math.cos(a1) * rOuter;
        const y1 = Math.sin(a1) * rOuter;
        const xm = Math.cos(amid) * rInner;
        const ym = Math.sin(amid) * rInner;
        const x2 = Math.cos(a2) * rOuter;
        const y2 = Math.sin(a2) * rOuter;

        if (i === 0) ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(xm, ym, x2, y2);
    }
    ctx.closePath();

    // Remplissage sombre titane satiné (#1c1c22)
    ctx.fillStyle = '#1c1c22';
    ctx.fill();

    ctx.restore();
}

// -----------------------------------------------------------------------------
// CHORÉGRAPHIE GLOBALE : LE TRAVELLING CAMÉRA QUI SUIT LA LIGNE ÉPAISSE
// -----------------------------------------------------------------------------
function drawScene(t) {
    g.clearRect(0, 0, 1920, 1080);

    // 1. Fond de base studio
    const bgGrad = g.createLinearGradient(0, 0, 1920, 1080);
    bgGrad.addColorStop(0, '#f8f9fb');
    bgGrad.addColorStop(0.65, '#eef0f4');
    bgGrad.addColorStop(1, '#e2e5ea');
    g.fillStyle = bgGrad;
    g.fillRect(0, 0, 1920, 1080);

    // 1b. Fondu atmosphérique vers l'espace cosmique royal pour la Scène 2
    let cosP = 0;
    if (t >= 3.8) {
        cosP = ease.inOut(clamp((t - 3.8) / 1.8, 0, 1));
        g.save();
        g.globalAlpha = cosP;

        // Dégradé céleste cosmique
        const cosGrad = g.createLinearGradient(0, 0, 1920, 1080);
        cosGrad.addColorStop(0, '#06174a');
        cosGrad.addColorStop(0.35, '#0c2d82');
        cosGrad.addColorStop(0.7, '#1e68d7');
        cosGrad.addColorStop(1, '#3b92f6');
        g.fillStyle = cosGrad;
        g.fillRect(0, 0, 1920, 1080);

        // Orbe Magenta / Rose Céleste en haut à droite
        const orb1Grad = g.createRadialGradient(1650, 150, 50, 1650, 150, 750);
        orb1Grad.addColorStop(0, 'rgba(244, 114, 182, 0.45)');
        orb1Grad.addColorStop(0.5, 'rgba(192, 132, 252, 0.2)');
        orb1Grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = orb1Grad;
        g.fillRect(0, 0, 1920, 1080);

        // Orbe Cyan / Électrique en bas au centre
        const orb2Grad = g.createRadialGradient(960, 950, 80, 960, 950, 800);
        orb2Grad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
        orb2Grad.addColorStop(0.6, 'rgba(30, 64, 175, 0.15)');
        orb2Grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        g.fillStyle = orb2Grad;
        g.fillRect(0, 0, 1920, 1080);

        // Poussière d'étoiles scintillante
        SCENE2_STARS.forEach(s => {
            const twinkle = Math.sin(t * 3 + s.x) * 0.25 + 0.75;
            g.fillStyle = `rgba(255, 255, 255, ${s.alpha * twinkle})`;
            g.beginPath();
            g.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            g.fill();
        });
        g.restore();
    }

    // 2. Grille de fond avec effet fondu radial (s'estompe lors du travelling)
    if (cosP < 1.0) {
        g.save();
        g.globalAlpha = 1.0 - cosP;
        drawFadedGrid(g, t);
        g.restore();
    }

    // =========================================================================
    // TRAVELLING CAMÉRA CINÉMATIQUE (0s à 10s) :
    // 0.0s – 3.8s : Caméra fixe sur Scène 1 (960, 540)
    // 3.8s – 5.8s : Le travelling suit la grosse ligne épaisse vers (3400, 1800) !
    // 5.8s – 10.0s : Caméra posée sur Scène 2 (2X Publish)
    // =========================================================================
    let camTargetX = 960;
    let camTargetY = 540;
    let camZoom = 1.0;

    if (t >= 3.8 && t < 5.8) {
        const transP = ease.inOut(clamp((t - 3.8) / 2.0, 0, 1));
        
        // La caméra suit le chemin courbé de la ligne
        const waveGuide = getWavePoint(lerp(0.32, 0.78, transP), t);
        camTargetX = waveGuide.x;
        camTargetY = waveGuide.y;
        
        // Léger dézoom pendant le grand travelling aérien puis re-zoom
        const dive = Math.sin(transP * Math.PI) * 0.22;
        camZoom = 1.0 - dive;
    } else if (t >= 5.8) {
        camTargetX = 3400;
        camTargetY = 1800;
        camZoom = 1.0;
    }

    g.save();
    // Application de la caméra cinématique
    g.translate(960, 540);
    g.scale(camZoom, camZoom);
    g.translate(-camTargetX, -camTargetY);

    // 3. DESSINER LA GROSSE LIGNE ÉPAISSE DANS TOUT LE MONDE
    drawThickWaveLine(g, t);

    // 4. DESSINER LA SCÈNE 1 (WALLET CARD)
    drawWalletCardScene(g, t);

    // 5. DESSINER LA SCÈNE 2 (NOUVEAU DESIGN 2X PUBLISH)
    drawScene2GrowthStation(g, t);

    g.restore();

    // =========================================================================
    // 6. ÉTOILES TOURNANTES SUR LA DIAGONALE DU CADRE (TOP-RIGHT & BOTTOM-LEFT)
    // Positionnées sur les coins diagonaux : une partie du corps est visible à l'écran,
    // tandis que les pointes rotatives dépassent dynamiquement le cadre de la vidéo !
    // =========================================================================
    const starRotationSpeed = 0.55; // Vitesse de rotation continue
    const starRot1 = t * starRotationSpeed;
    const starRot2 = -t * starRotationSpeed; // Rotation inverse harmonieuse

    // Coin 1 : Haut-Droit (1800, 120) avec rayon 230px -> dépasse x=1920 et y=0
    drawCornerStar(g, 1800, 120, 230, 52, starRot1);

    // Coin 2 : Bas-Gauche (120, 960) avec rayon 230px -> dépasse x=0 et y=1080
    drawCornerStar(g, 120, 960, 230, 52, starRot2);

    // =========================================================================
    // RÈGLE 30 : FONDU DE FIN OBLIGATOIRE (9.0s à 10.0s)
    // =========================================================================
    if (t >= 9.0) {
        const fadeP = clamp((t - 9.0) / 1.0, 0, 1);
        g.save();
        g.fillStyle = `rgba(0, 0, 0, ${fadeP})`;
        g.fillRect(0, 0, 1920, 1080);
        g.restore();
    }
}

// ==============================================================================
// CONTRAT STUDIO VIBEEDITOR
// ==============================================================================
window.renderAt = function(timeInSeconds) {
    playbackTime = clamp(timeInSeconds, 0, DURATION);
    drawScene(playbackTime);
};

window.DURATION = DURATION;
window.duration = DURATION;
window.__timeline = {
    duration: DURATION,
    currentTime: 0,
    fps: 60,
    seek: function(t) {
        window.renderAt(t);
    }
};

window.syncAudioTimeline = function(timeInSeconds) {
    playbackTime = clamp(timeInSeconds, 0, DURATION);
    if (window.__timeline) window.__timeline.currentTime = playbackTime;

    let masterBgmVol = 0.35;
    if (playbackTime >= 9.0) {
        masterBgmVol = 0.35 * clamp((DURATION - playbackTime) / 1.0, 0, 1);
    }
    audioBgm.volume = masterBgmVol;
};

function loop(timestamp) {
    if (!isPlaying) return;

    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    playbackTime += dt;
    if (window.__timeline) window.__timeline.currentTime = playbackTime;

    let masterBgmVol = 0.35;
    if (playbackTime >= 9.0) {
        masterBgmVol = 0.35 * clamp((DURATION - playbackTime) / 1.0, 0, 1);
    }
    audioBgm.volume = masterBgmVol;

    drawScene(playbackTime);

    if (playbackTime >= DURATION) {
        pause();
        return;
    }

    rafId = requestAnimationFrame(loop);
}

function play() {
    if (isPlaying) return;
    isPlaying = true;
    lastTimestamp = 0;
    audioBgm.volume = 0.35;
    audioBgm.currentTime = playbackTime % audioBgm.duration;
    audioBgm.play().catch(() => {});
    rafId = requestAnimationFrame(loop);
}

function pause() {
    isPlaying = false;
    if (rafId) cancelAnimationFrame(rafId);
    audioBgm.pause();
}

window.play = play;
window.pause = pause;
window.seek = function(t) { window.renderAt(t); };

window.addEventListener('DOMContentLoaded', () => {
    window.renderAt(0);
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        isPlaying ? pause() : play();
    }
});
</script>
