<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowKaz Stickman — 15s Cinematic 16:9</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #020604;
            color: #f1f5f9;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* VIEWPORT WRAPPER — S'adapte à l'écran sans jamais déformer le 16:9 */
        #viewport {
            position: relative;
            width: 100vw;
            height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #010403;
        }

        /* CADRE VIDÉO 16:9 STRICT (1920x1080) — ZÉRO CONTRÔLE À L'INTÉRIEUR */
        #stage {
            width: 1920px;
            height: 1080px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            overflow: hidden;
            background: #030d08;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.95), 0 0 60px rgba(16, 185, 129, 0.12);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* EFFETS CINÉMATIQUES VIDÉO */
        .cinematic-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 50%, rgba(1, 6, 4, 0.75) 100%);
            pointer-events: none;
            z-index: 10;
        }
        .cinematic-grain {
            position: absolute;
            inset: 0;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 11;
        }

        /* BARRE DE CONTRÔLE HORS VIDÉO (DOCK EN BAS DE PAGE) */
        #pageFooter {
            width: 100%;
            height: 64px;
            background: #030906;
            border-top: 1px solid rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 100;
        }
        .footer-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .footer-center {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            max-width: 650px;
            margin: 0 32px;
        }
        .footer-right {
            display: flex;
            align-items: center;
            gap: 12px;

        }
        .btn-ctrl {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #c6ff3d;
            font-size: 13px;
            font-weight: 700;
            padding: 7px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;

        }
        .btn-ctrl:hover {
            background: rgba(198, 255, 61, 0.25);

            border-color: #c6ff3d;
        }
        #scrubber {
            flex: 1;
            height: 6px;
            accent-color: #c6ff3d;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ZONE DE VISIONNAGE -->
    <div id="viewport">
        <!-- CADRE STRICT 16:9 (1920x1080) — ZÉRO ÉLÉMENT DE DEBUG NI BOUTON LECTEUR DEDANS -->
        <div id="stage" data-duration="15.0" data-width="1920" data-height="1080">
            <canvas id="videoCanvas" width="1920" height="1080"></canvas>
            <div class="cinematic-vignette"></div>
            <div class="cinematic-grain"></div>
        </div>
    </div>

    <!-- CONTRÔLES HORS VIDÉO (NAVBAR BAS DE PAGE) -->
    <footer id="pageFooter">
        <div class="footer-left">
            <button id="btnPlayPause" class="btn-ctrl">
                <span id="playIcon">▶</span> <span id="playLabel">Lecture</span>
            </button>
            <button id="btnRestart" class="btn-ctrl" title="Recommencer">↺</button>
            <span class="text-xs font-mono text-emerald-400 font-bold uppercase tracking-wider">
                GrowKaz Stickman // 16:9 Cinematic (15.0s)
            </span>
        </div>

        <div class="footer-center">
            <input type="range" id="scrubber" min="0" max="15.0" step="0.05" value="0">
            <span id="timeDisplay" class="font-mono text-xs text-emerald-400 font-bold min-w-[95px] text-right">00:00 / 00:15</span>
        </div>

        <div class="footer-right">
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-mono bg-emerald-500/10 text-emerald-300 border border-emerald-500/30">
                1920×1080 60FPS
            </span>
            <span class="text-xs text-slate-400 font-mono">Espace : Play / Pause</span>
        </div>
    </footer>

    <!-- Audio Elements -->
    <audio id="audioVoice" src="../01_Assets/Voix_Off/growkaz_video_15s.wav" preload="auto"></audio>
    <audio id="audioBgm" src="../01_Assets/Musiques/Wallpaper.mp3" preload="auto" loop></audio>

<script>
/**
 * AUTOFRAME 1.0 — GROWKAZ STICKMAN 2D CINEMATIC (15.0s / 16:9 1920x1080 60FPS)
 * Design Haute Rétention Style GrowKaz Emerald :
 * - Stickman noir profond stylisé avec double rim-light néon émeraude (#c6ff3d)
 * - Arrière-plan cinématique moody (#020805 à #082015) avec grille blueprint 3D
 * - HUD holographique en verre dépoli avec courbe exponentielle de dopamine
 * - Sous-titres cinétiques épurés avec mot-clé dynamique
 * - ZÉRO bouton ni debug dans le rendu vidéo
 */

const stage = document.getElementById('stage');
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const audioVoice = document.getElementById('audioVoice');
const audioBgm = document.getElementById('audioBgm');
const btnPlayPause = document.getElementById('btnPlayPause');
const playIcon = document.getElementById('playIcon');
const playLabel = document.getElementById('playLabel');
const btnRestart = document.getElementById('btnRestart');
const scrubber = document.getElementById('scrubber');
const timeDisplay = document.getElementById('timeDisplay');

const DURATION = 15.0;
let currentTime = 0;
let isPlaying = false;
let lastTimestamp = 0;
let rafId = null;

// Redimensionnement automatique pour conserver le 16:9 parfait quel que soit l'écran
function fitStage() {
    const vp = document.getElementById('viewport');
    const vw = vp.clientWidth;
    const vh = vp.clientHeight;
    const scale = Math.min(vw / 1920, vh / 1080) * 0.96;
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
fitStage();

// Math helpers
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return (--t) * t * t + 1; }
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

// Floating particles
const PARTICLES = [];
for (let i = 0; i < 60; i++) {
    PARTICLES.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        size: 2 + Math.random() * 3,
        speedY: -0.3 - Math.random() * 0.7,
        speedX: (Math.random() - 0.5) * 0.3,
        alpha: 0.2 + Math.random() * 0.6,
        phase: Math.random() * Math.PI * 2
    });
}

// Subtitles
const SUBTITLES = [
    { start: 0.8, end: 3.2, text: "LA MOTIVATION EST UN PIÈGE.", highlight: "PIÈGE", color: "#c6ff3d" },
    { start: 3.2, end: 6.8, text: "99% DES GENS ATTENDENT D'ÊTRE PRÊTS.", highlight: "99%", color: "#ef4444" },
    { start: 6.8, end: 8.9, text: "MAIS LE CERVEAU NE FONCTIONNE PAS AINSI.", highlight: "CERVEAU", color: "#38bdf8" },
    { start: 8.9, end: 12.2, text: "C'EST LE MOUVEMENT QUI CRÉE LA DOPAMINE.", highlight: "DOPAMINE", color: "#c6ff3d" },
    { start: 12.2, end: 14.8, text: "FAIS LE PREMIER PAS, MAINTENANT.", highlight: "MAINTENANT", color: "#c6ff3d" }
];

// Draw moody cinematic background
function drawBackground(t) {
    // 1. Base dark forest radial gradient
    const grad = ctx.createRadialGradient(960, 540, 150, 960, 540, 1200);
    grad.addColorStop(0, '#0a2e1d');
    grad.addColorStop(0.55, '#04170e');
    grad.addColorStop(1, '#010604');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1920, 1080);

    // 2. Light beam / aura
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.8);
    const aura = ctx.createRadialGradient(700, 480, 80, 700, 480, 700);
    aura.addColorStop(0, `rgba(16, 185, 129, ${0.14 + 0.05 * pulse})`);
    aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = aura;
    ctx.fillRect(0, 0, 1920, 1080);

    // 3. Blueprint technical grid (16:9 cinematic scale)
    ctx.save();
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.07)';
    ctx.lineWidth = 1.5;
    const gridSize = 80;
    const offsetX = (t * 12) % gridSize;

    for (let x = offsetX; x <= 1920; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1080);
        ctx.stroke();
    }
    for (let y = 0; y <= 1080; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1920, y);
        ctx.stroke();
    }
    ctx.restore();

    // 4. Floating neon dust particles
    ctx.save();
    PARTICLES.forEach(p => {
        const y = (p.y + p.speedY * t * 60) % 1080;
        const actualY = y < 0 ? y + 1080 : y;
        const x = p.x + Math.sin(t + p.phase) * 25;
        const a = p.alpha * (0.6 + 0.4 * Math.sin(t * 3 + p.phase));

        ctx.fillStyle = `rgba(198, 255, 61, ${a})`;
        ctx.shadowColor = '#c6ff3d';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, actualY, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();

    // 5. Minimalist Header Telemetry (16:9 safe margins)
    ctx.save();
    ctx.font = '700 20px "JetBrains Mono"';
    ctx.fillStyle = 'rgba(16, 185, 129, 0.85)';
    ctx.fillText('GROWKAZ BLUEPRINT // SYSTEM 2.5D', 100, 80);

    ctx.font = '500 15px "JetBrains Mono"';
    ctx.fillStyle = 'rgba(168, 232, 192, 0.5)';
    ctx.fillText(`TIME: ${t.toFixed(2)}s | 60FPS | SEED: 0x94F9 | COMPOUND ENGINE`, 100, 110);

    ctx.textAlign = 'right';
    ctx.font = '700 18px "JetBrains Mono"';
    ctx.fillStyle = '#c6ff3d';
    ctx.fillText('DISCIPLINE > MOTIVATION', 1820, 80);
    ctx.font = '500 14px "JetBrains Mono"';
    ctx.fillStyle = 'rgba(168, 232, 192, 0.5)';
    ctx.fillText('THE 1% ACTION FRAMEWORK', 1820, 110);
    ctx.restore();
}

// Draw High-End Stylized Stickman with Multi-Layer Rim Light
function drawStickman(cx, cy, scale, pose, rimColor = '#c6ff3d') {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // Ground Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.beginPath();
    ctx.ellipse(0, 310, 100, 16, 0, 0, Math.PI * 2);
    ctx.fill();

    function drawLimb(x1, y1, x2, y2, strokeW = 14) {
        // 1. Neon Rim Outer Glow
        ctx.save();
        ctx.strokeStyle = rimColor;
        ctx.lineWidth = strokeW + 7;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = rimColor;
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        // 2. Inner Jet Black Core
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#030805';
        ctx.lineWidth = strokeW;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
    }

    // Spine
    drawLimb(0, 0, pose.hipX, pose.hipY, 18);

    // Legs
    drawLimb(pose.hipX, pose.hipY, pose.kneeLX, pose.kneeLY, 15);
    drawLimb(pose.kneeLX, pose.kneeLY, pose.footLX, pose.footLY, 15);

    drawLimb(pose.hipX, pose.hipY, pose.kneeRX, pose.kneeRY, 15);
    drawLimb(pose.kneeRX, pose.kneeRY, pose.footRX, pose.footRY, 15);

    // Arms
    drawLimb(0, 20, pose.elbowLX, pose.elbowLY, 13);
    drawLimb(pose.elbowLX, pose.elbowLY, pose.handLX, pose.handLY, 13);

    drawLimb(0, 20, pose.elbowRX, pose.elbowRY, 13);
    drawLimb(pose.elbowRX, pose.elbowRY, pose.handRX, pose.handRY, 13);

    // Head
    ctx.save();
    ctx.shadowColor = rimColor;
    ctx.shadowBlur = 32;
    ctx.beginPath();
    ctx.arc(pose.headX, pose.headY, 50, 0, Math.PI * 2);
    ctx.fillStyle = '#030805';
    ctx.strokeStyle = rimColor;
    ctx.lineWidth = 8;
    ctx.fill();
    ctx.stroke();

    // Expressive Focus Visor / Eye
    ctx.fillStyle = rimColor;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.ellipse(pose.headX + pose.eyeOffsetX, pose.headY - 4, 8, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
}

// Holographic HUD Card with Real-time Exponential Curve
function drawHolographicHud(x, y, w, h, t, progress) {
    ctx.save();
    ctx.translate(x, y);

    // Dark Frosted Glass backdrop
    ctx.fillStyle = 'rgba(4, 20, 14, 0.88)';
    ctx.strokeStyle = 'rgba(140, 255, 170, 0.35)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(16, 185, 129, 0.3)';
    ctx.shadowBlur = 30;

    ctx.beginPath();
    ctx.roundRect(0, 0, w, h, 24);
    ctx.fill();
    ctx.stroke();

    // Header inside HUD
    ctx.font = '800 22px "JetBrains Mono"';
    ctx.fillStyle = '#c6ff3d';
    ctx.fillText('NEURAL DOPAMINE SURGE', 36, 52);

    ctx.font = '700 16px "JetBrains Mono"';
    ctx.fillStyle = 'rgba(168, 232, 192, 0.7)';
    ctx.fillText('EXPONENTIAL GAIN : +430%', w - 280, 52);

    // Divider
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.2)';
    ctx.beginPath();
    ctx.moveTo(36, 75);
    ctx.lineTo(w - 36, 75);
    ctx.stroke();

    // Graph Area
    const gx = 36;
    const gy = 100;
    const gw = w - 72;
    const gh = h - 210;

    // Grid lines inside graph
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 3; i++) {
        const lineY = gy + (gh / 3) * i;
        ctx.beginPath();
        ctx.moveTo(gx, lineY);
        ctx.lineTo(gx + gw, lineY);
        ctx.stroke();
    }

    // Glowing Curve
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(gx, gy + gh);

    const steps = 40;
    const maxT = clamp(progress, 0, 1);

    for (let i = 0; i <= steps * maxT; i++) {
        const u = i / steps;
        const px = gx + u * gw;
        const py = gy + gh - Math.pow(u, 2.7) * gh;
        ctx.lineTo(px, py);
    }

    ctx.strokeStyle = '#c6ff3d';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.shadowColor = '#c6ff3d';
    ctx.shadowBlur = 20;
    ctx.stroke();

    // Peak Target Dot
    if (maxT > 0.05) {
        const tx = gx + maxT * gw;
        const ty = gy + gh - Math.pow(maxT, 2.7) * gh;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#c6ff3d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(tx, ty, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
    }
    ctx.restore();

    // Bottom Metric Cards
    const cardW = (w - 92) / 2;
    const by = h - 85;

    // Metric 1
    ctx.fillStyle = 'rgba(1, 10, 6, 0.75)';
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.25)';
    ctx.beginPath();
    ctx.roundRect(36, by, cardW, 60, 12);
    ctx.fill();
    ctx.stroke();

    ctx.font = '600 13px "JetBrains Mono"';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('TEMPS DE PASSAGE À L\'ACTION', 50, by + 24);
    ctx.font = '800 20px "JetBrains Mono"';
    ctx.fillStyle = '#c6ff3d';
    ctx.fillText('< 5 SECONDES', 50, by + 50);

    // Metric 2
    ctx.fillStyle = 'rgba(1, 10, 6, 0.75)';
    ctx.beginPath();
    ctx.roundRect(36 + cardW + 20, by, cardW, 60, 12);
    ctx.fill();
    ctx.stroke();

    ctx.font = '600 13px "JetBrains Mono"';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('LIBÉRATION DOPAMINE', 50 + cardW + 20, by + 24);
    ctx.font = '800 20px "JetBrains Mono"';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('IMMÉDIATE', 50 + cardW + 20, by + 50);

    ctx.restore();
}

// Subtitles Bar (16:9 Cinema Grade)
function drawSubtitles(t) {
    const currentSub = SUBTITLES.find(s => t >= s.start && t <= s.end);
    if (!currentSub) return;

    ctx.save();
    const progress = (t - currentSub.start) / (currentSub.end - currentSub.start);
    const alpha = clamp(progress < 0.12 ? progress / 0.12 : (progress > 0.88 ? (1 - progress) / 0.12 : 1), 0, 1);
    const translateY = lerp(16, 0, easeOutCubic(clamp(progress * 4, 0, 1)));

    ctx.translate(960, 960 + translateY);
    ctx.globalAlpha = alpha;

    ctx.font = '800 36px "Montserrat"';
    const textWidth = ctx.measureText(currentSub.text).width;
    const boxW = Math.min(1500, textWidth + 80);
    const boxH = 75;

    ctx.fillStyle = 'rgba(2, 8, 5, 0.88)';
    ctx.strokeStyle = 'rgba(16, 185, 129, 0.4)';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
    ctx.shadowBlur = 25;

    ctx.beginPath();
    ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 18);
    ctx.fill();
    ctx.stroke();

    // Text rendering with highlight
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const words = currentSub.text.split(' ');
    let fullW = 0;
    const wordWidths = words.map(w => {
        const mw = ctx.measureText(w + ' ').width;
        fullW += mw;
        return mw;
    });

    let currentX = -fullW / 2;
    words.forEach((w, idx) => {
        const isHighlight = w.includes(currentSub.highlight);
        if (isHighlight) {
            ctx.fillStyle = currentSub.color;
            ctx.shadowColor = currentSub.color;
            ctx.shadowBlur = 18;
        } else {
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }
        ctx.textAlign = 'left';
        ctx.fillText(w, currentX, 0);
        currentX += wordWidths[idx];
    });

    ctx.restore();
}

// Master Render Function
function renderFrame(t) {
    ctx.clearRect(0, 0, 1920, 1080);

    // 1. Fond moody
    drawBackground(t);

    // 2. Chorégraphie 4 Phases en 16:9
    if (t < 3.5) {
        // --- PHASE 1 : L'ILLUSION (0.0s - 3.5s) ---
        const enter = easeOutCubic(clamp(t / 1.0, 0, 1));
        const stickmanX = lerp(450, 520, enter);

        const pose = {
            headX: 0, headY: -70, eyeOffsetX: 20,
            hipX: 0, hipY: 140,
            kneeLX: -35, kneeLY: 220, footLX: -50, footLY: 310,
            kneeRX: 35, kneeRY: 220, footRX: 50, footRY: 310,
            elbowLX: -55, elbowLY: 70, handLX: -30, handLY: 20, // réflexion
            elbowRX: 50, elbowRY: 80, handRX: 75, handRY: 150
        };
        drawStickman(stickmanX, 560, 1.35, pose, '#c6ff3d');

        // Big Cinematic Callout on Right
        ctx.save();
        ctx.translate(1220, 480);
        ctx.textAlign = 'center';
        ctx.font = '900 68px "Outfit"';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#c6ff3d';
        ctx.shadowBlur = 28;
        ctx.fillText('LE PIÈGE DE LA MOTIVATION', 0, 0);

        ctx.font = '700 24px "JetBrains Mono"';
        ctx.fillStyle = 'rgba(198, 255, 61, 0.9)';
        ctx.fillText('[ ATTENDRE DE SE SENTIR PRÊT = ILLUSION ]', 0, 65);
        ctx.restore();

    } else if (t < 7.0) {
        // --- PHASE 2 : LA STATISTIQUE 99% (3.5s - 7.0s) ---
        const phaseT = t - 3.5;
        const slide = easeOutCubic(clamp(phaseT / 0.8, 0, 1));

        // Stickman on left
        const pose = {
            headX: 0, headY: -70, eyeOffsetX: 24,
            hipX: 0, hipY: 140,
            kneeLX: -30, kneeLY: 220, footLX: -40, footLY: 310,
            kneeRX: 35, kneeRY: 220, footRX: 50, footRY: 310,
            elbowLX: -45, elbowLY: 70, handLX: -65, handLY: 140,
            elbowRX: 70, elbowRY: 30, handRX: 140, handRY: -20
        };
        drawStickman(420, 560, 1.3, pose, '#c6ff3d');

        // 99% Card on Right
        ctx.save();
        ctx.translate(lerp(1800, 1020, slide), 280);
        ctx.fillStyle = 'rgba(25, 6, 6, 0.88)';
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(239, 68, 68, 0.35)';
        ctx.shadowBlur = 35;

        ctx.beginPath();
        ctx.roundRect(0, 0, 720, 480, 24);
        ctx.fill();
        ctx.stroke();

        ctx.font = '900 96px "Montserrat"';
        ctx.fillStyle = '#ef4444';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 24;
        ctx.fillText('99%', 60, 130);

        ctx.font = '800 36px "Montserrat"';
        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 0;
        ctx.fillText('ABANDONNENT EN ATTENDANT', 60, 195);

        ctx.font = '600 20px "JetBrains Mono"';
        ctx.fillStyle = '#f87171';
        ctx.fillText('DIAGNOSTIC : PARALYSIE PAR L\'ANALYSE', 60, 260);
        ctx.fillText('CAUSE : RECHERCHE DU MOMENT PARFAIT', 60, 300);

        // Progress bar
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.roundRect(60, 360, 600, 24, 12);
        ctx.fill();

        ctx.fillStyle = '#ef4444';
        const fillW = clamp((phaseT - 0.4) / 1.6, 0, 1) * 600;
        ctx.beginPath();
        ctx.roundRect(60, 360, fillW, 24, 12);
        ctx.fill();

        ctx.font = '700 17px "JetBrains Mono"';
        ctx.fillStyle = '#fca5a5';
        ctx.fillText('RÉSULTAT : 0% D\'EXÉCUTION', 60, 430);
        ctx.restore();

    } else if (t < 11.5) {
        // --- PHASE 3 : LE MOUVEMENT CRÉE LA DOPAMINE (7.0s - 11.5s) ---
        const phaseT = t - 7.0;
        const progress = clamp(phaseT / 3.8, 0, 1);

        // Dynamic walking stride
        const walk = Math.sin(phaseT * 6);
        const pose = {
            headX: 0, headY: -70 + Math.abs(walk) * 8, eyeOffsetX: 25,
            hipX: 0, hipY: 140,
            kneeLX: -35 + walk * 45, kneeLY: 220, footLX: -50 + walk * 65, footLY: 310,
            kneeRX: 35 - walk * 45, kneeRY: 220, footRX: 50 - walk * 65, footRY: 310,
            elbowLX: -50 - walk * 30, elbowLY: 60, handLX: -80 - walk * 45, handLY: 120,
            elbowRX: 60 + walk * 30, elbowRY: 40, handRX: 120 + walk * 45, handRY: 60
        };
        drawStickman(420, 560, 1.25, pose, '#c6ff3d');

        // Holographic Blueprint HUD (Growth curve) on Right
        drawHolographicHud(820, 260, 960, 520, t, progress);

    } else {
        // --- PHASE 4 : CLIMAX — PASSE À L'ACTION MAINTENANT (11.5s - 15.0s) ---
        const phaseT = t - 11.5;
        const pulse = 1 + 0.04 * Math.sin(phaseT * 8);

        // Hero Center Pose
        const pose = {
            headX: 0, headY: -70, eyeOffsetX: 0,
            hipX: 0, hipY: 140,
            kneeLX: -65, kneeLY: 220, footLX: -95, footLY: 310,
            kneeRX: 65, kneeRY: 220, footRX: 95, footRY: 310,
            elbowLX: -85, elbowLY: 60, handLX: -140, handLY: 20,
            elbowRX: 85, elbowRY: 60, handRX: 140, handRY: 20
        };
        drawStickman(960, 600, 1.5 * pulse, pose, '#c6ff3d');

        // Monumental Typography
        ctx.save();
        ctx.translate(960, 240);
        ctx.textAlign = 'center';
        ctx.font = '900 84px "Outfit"';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#c6ff3d';
        ctx.shadowBlur = 35;
        ctx.fillText('PASSE À L\'ACTION', 0, 0);

        ctx.font = '900 64px "Montserrat"';
        ctx.fillStyle = '#c6ff3d';
        ctx.fillText('MAINTENANT.', 0, 90);

        ctx.font = '800 22px "JetBrains Mono"';
        ctx.fillStyle = 'rgba(168, 232, 192, 0.9)';
        ctx.shadowBlur = 0;
        ctx.fillText('LA DISCIPLINE SUPÉRIEURE AU TALENT', 0, 160);
        ctx.restore();
    }

    // 3. Sous-titres cinématiques
    drawSubtitles(t);
}

// Tick loop
function tick(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    if (isPlaying) {
        currentTime += dt;
        if (currentTime >= DURATION) {
            currentTime = DURATION;
            isPlaying = false;
            playIcon.innerText = '↺';
            playLabel.innerText = 'Rejouer';
            audioVoice.pause();
            audioBgm.pause();
        }
        scrubber.value = currentTime;
        updateTimeDisplay();
    }

    renderFrame(currentTime);

    if (isPlaying) {
        rafId = requestAnimationFrame(tick);
    }
}

function updateTimeDisplay() {
    const cur = currentTime.toFixed(1);
    timeDisplay.innerText = `${cur < 10 ? '0' + cur : cur}s / 15.0s`;
}

function play() {
    if (currentTime >= DURATION) currentTime = 0;
    isPlaying = true;
    lastTimestamp = performance.now();
    playIcon.innerText = '⏸';
    playLabel.innerText = 'Pause';

    audioVoice.currentTime = currentTime;
    audioVoice.play().catch(e => console.warn(e));

    audioBgm.currentTime = currentTime % audioBgm.duration;
    audioBgm.volume = 0.22;
    audioBgm.play().catch(e => console.warn(e));

    rafId = requestAnimationFrame(tick);
}

function pause() {
    isPlaying = false;
    playIcon.innerText = '▶';
    playLabel.innerText = 'Lecture';
    audioVoice.pause();
    audioBgm.pause();
    if (rafId) cancelAnimationFrame(rafId);
}

btnPlayPause.addEventListener('click', () => {
    if (isPlaying) pause();
    else play();
});

btnRestart.addEventListener('click', () => {
    pause();
    currentTime = 0;
    scrubber.value = 0;
    updateTimeDisplay();
    renderFrame(0);
});

scrubber.addEventListener('input', (e) => {
    pause();
    currentTime = parseFloat(e.target.value);
    audioVoice.currentTime = currentTime;
    updateTimeDisplay();
    renderFrame(currentTime);
});

// Click sur la vidéo ou Espace pour Play/Pause
document.getElementById('stage').addEventListener('click', () => {
    if (isPlaying) pause();
    else play();
});

window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
        e.preventDefault();
        if (isPlaying) pause();
        else play();
    }
});

// Window API pour le moteur de rendu natif CDP / FFmpeg
window.__timeline = {
    seek: function(sec) {
        currentTime = clamp(sec, 0, DURATION);
        renderFrame(currentTime);
    },
    duration: DURATION
};

// Premier rendu
renderFrame(0);
</script>
