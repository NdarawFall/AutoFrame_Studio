<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composant — Arrière-Plan Texturé Shorts (Règle #15)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        /* Cadre de simulation Short 9:16 (ou plein écran si utilisé dans une scène) */
        .viewport-short {
            width: 1080px;
            max-width: 420px;
            height: 100vh;
            max-height: 840px;
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 1. Couche Dégradé Radial Profond */
        .layer-gradient {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 35%, #182234 0%, #0c1017 60%, #06080c 100%);
            z-index: 1;
        }

        /* 2. Couche Grille Vectorielle Fine (Grid Lines) */
        .layer-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
        }

        /* 3. Couche Trame Demi-Teinte (Halftone Texture) */
        .layer-halftone {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.35;
            z-index: 3;
            pointer-events: none;
        }

        /* 4. Halos lumineux d'ambiance aux coins opposés (Règle #10 & #15) */
        .corner-glow-tl {
            position: absolute;
            top: -60px;
            left: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.25);
            filter: blur(50px);
            z-index: 4;
            pointer-events: none;
        }

        .corner-glow-br {
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.25);
            filter: blur(60px);
            z-index: 4;
            pointer-events: none;
        }

        /* Contenu Exemple d'Habillage */
        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
            color: #fff;
        }

        .badge-tag {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .center-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .hero-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.6));
        }

        .hero-text {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>

    <div class="viewport-short">
        <div class="layer-gradient"></div>
        <div class="layer-grid"></div>
        <div class="layer-halftone"></div>
        <div class="corner-glow-tl"></div>
        <div class="corner-glow-br"></div>

        <div class="content-layer">
            <span class="badge-tag">Règle #15 • Fond Shorts</span>
            
            <div class="center-hero">
                <div class="hero-icon">⚡</div>
                <div class="hero-text">
                    Arrière-plan Pro :<br>
                    <span style="color:#38bdf8;">Grille + Halftone + Halos</span>
                </div>
            </div>

            <p style="font-size: 0.8125rem; color: #94a3b8; margin: 0;">
                Zéro fond uni fade. Le regard reste capté sur le sujet central.
            </p>
        </div>
    </div>

</body>
</html>
