<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composant — Empilement Vertical Sous-titres + UI (Règles #9 & #17)</title>
    <link rel="stylesheet" href="../shadcn.css">
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #09090b;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            color: #fff;
        }

        /* Simulation Cadre Vertical Short 9:16 */
        .short-frame {
            width: 420px;
            height: 840px;
            position: relative;
            background: radial-gradient(circle at 50% 25%, #1e1b4b 0%, #09090b 80%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px;
        }

        /* 1. Tiers Supérieur : Sujet / Visage */
        .speaker-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 40px;
        }

        .speaker-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #312e81;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .speaker-label {
            font-size: 0.8125rem;
            color: #a1a1aa;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 2. Tiers Inférieur : Zone Sécurisée d'Empilement Sous-titre + UI */
        .bottom-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Sous-titre Viral Dynamique (Hormozi / Bold Sans) */
        .subtitle-box {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            text-align: center;
            line-height: 1.25;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.9);
            max-width: 340px;
        }

        .highlight-word {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-block;
        }

        /* Carte UI ancrée sous le sous-titre (Règle #17 : Largeur <= Largeur sous-titre) */
        .anchored-toast {
            width: 100%;
            max-width: 340px; /* Rigoureusement égale à la largeur max du sous-titre */
            background: rgba(18, 18, 22, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px) scale(0.92);
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #22c55e;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .toast-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .toast-title {
            font-size: 0.875rem;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }

        .toast-sub {
            font-size: 0.75rem;
            color: #a1a1aa;
            margin: 0;
        }

        .rule-badge {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 9999px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="short-frame">
        <span class="rule-badge">Règles #9 & #17 • Empilement Vertical</span>

        <!-- Tiers Supérieur : Présentateur -->
        <div class="speaker-zone">
            <div class="speaker-avatar">🎙️</div>
            <span class="speaker-label">Point Focal Visuel</span>
        </div>

        <!-- Tiers Inférieur : Sous-titre + UI alignée -->
        <div class="bottom-stack">
            <div class="subtitle-box">
                Et en moins de 24h, vous recevez votre <span class="highlight-word">Paiement</span>
            </div>

            <div id="toast" class="anchored-toast">
                <div class="toast-icon">✓</div>
                <div class="toast-info">
                    <p class="toast-title">Paiement reçu : +$2,500.00</p>
                    <p class="toast-sub">Virement instantané Stripe</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            gsap.to("#toast", {
                opacity: 1,
                y: 0,
                scale: 1,
                duration: 0.7,
                delay: 0.4,
                ease: "back.out(1.6)"
            });
        });
    </script>
</body>
</html>
