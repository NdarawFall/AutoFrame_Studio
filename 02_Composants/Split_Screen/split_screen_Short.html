<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Screen Vertical — Format Short (9:16)</title>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="split_screen.css">
    <style>
        :root {
            --bg-canvas: #090a0f;
            --accent-cyan: #00f0ff;
            --accent-pink: #ff0055;
            --accent-amber: #f59e0b;
            --border-glow: rgba(0, 240, 255, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-canvas);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- TOOLBAR DE CONTRÔLE --- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px;
        }

        .toolbar-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            margin-right: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-mode.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
        }

        /* --- SMARTPHONE STAGE 9:16 --- */
        .stage-wrapper {
            position: relative;
            width: 405px;
            height: 720px; /* Ratio 9:16 fidèle (1080x1920 normalisé) */
            background: #000000;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        /* Split container vertical standard */
        .split-short-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #000000;
        }

        .short-pane {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: flex 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .short-pane img,
        .short-pane video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Décorations gradients */
        .bg-gradient-top {
            background: radial-gradient(circle at 50% 30%, #312e81 0%, #0f172a 100%);
        }
        .bg-gradient-bottom {
            background: radial-gradient(circle at 50% 70%, #831843 0%, #0f172a 100%);
        }
        .bg-gradient-third {
            background: radial-gradient(circle at 50% 50%, #064e3b 0%, #0f172a 100%);
        }
        .bg-gradient-col1 {
            background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #090d16 100%);
        }
        .bg-gradient-col2 {
            background: radial-gradient(circle at 50% 60%, #831843 0%, #090d16 100%);
        }

        /* Badges flottants */
        .pane-tag {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .indicator-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .pane-tag.alt .indicator-dot {
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .pane-label {
            position: relative;
            z-index: 5;
            font-size: 19px;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 4px 16px rgba(0,0,0,0.8);
            padding: 0 20px;
        }

        .pane-label span {
            font-size: 11px;
            display: block;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        /* Modes de base */
        .layout-50-50 .short-pane:nth-child(1) { flex: 1; }
        .layout-50-50 .short-pane:nth-child(3) { flex: 1; }

        .layout-reaction .short-pane:nth-child(1) { flex: 0.38; }
        .layout-reaction .short-pane:nth-child(3) { flex: 0.62; }

        .layout-triple .short-pane { flex: 1; }

        .layout-pip { display: block !important; }
        .layout-pip .short-pane.base-fullscreen { width: 100%; height: 100%; position: absolute; inset: 0; }
        .layout-pip .pip-floating-box {
            position: absolute;
            top: 24px;
            right: 20px;
            width: 140px;
            height: 220px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(0, 240, 255, 0.4);
            z-index: 50;
        }

        /* Footer Meta Info */
        .short-footer-meta {
            position: absolute;
            bottom: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: rgba(255, 255, 255, 0.7);
        }

        .watermark {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body>

    <!-- SÉLECTEUR DE MODE SPLIT SHORT -->
    <div class="toolbar">
        <span class="toolbar-title">⚡ SHORT (9:16) :</span>
        <button class="btn-mode active" onclick="switchLayout('50_50', this)">50/50</button>
        <button class="btn-mode" onclick="switchLayout('reaction', this)">Réaction</button>
        <button class="btn-mode" onclick="switchLayout('triple', this)">Triple Stack</button>
        <button class="btn-mode" onclick="switchLayout('pip', this)">PiP</button>
        <!-- NOUVEAUX MODES -->
        <button class="btn-mode" onclick="switchLayout('side_by_side', this)">Côte-à-Côte (2 Col)</button>
        <button class="btn-mode" onclick="switchLayout('square_card', this)">Card Carrée 1:1 (Réf 1)</button>
        <button class="btn-mode" onclick="switchLayout('blur_card', this)">Card Verticale (Réf 2)</button>
        <button class="btn-mode" onclick="switchLayout('curved_banner', this)">Bandeau Incurvé (Réf 3)</button>
        <button class="btn-mode" onclick="switchLayout('tutorial_short', this)">Tutoriel Express</button>
    </div>

    <!-- ZONE DE RENDU SMARTPHONE (9:16) -->
    <div class="stage-wrapper" id="stageWrapper">
        <div id="splitStage" class="split-short-container layout-50-50">
            <!-- Haut -->
            <div class="short-pane bg-gradient-top" id="paneTop">
                <div class="pane-tag">
                    <span class="indicator-dot"></span>
                    <span>CAMÉRA 01</span>
                </div>
                <div class="pane-label">
                    <span>Facecam / Narration</span>
                    Locuteur Principal
                </div>
            </div>

            <!-- Divider -->
            <div class="split-divider-h" id="dividerH"></div>

            <!-- Bas -->
            <div class="short-pane bg-gradient-bottom" id="paneBottom">
                <div class="pane-tag alt">
                    <span class="indicator-dot"></span>
                    <span>B-ROLL / DEMO</span>
                </div>
                <div class="pane-label">
                    <span>Gameplay & Extraits</span>
                    Preuve & Illustration
                </div>
            </div>
        </div>

        <div class="short-footer-meta" id="footerMeta">
            <span class="watermark">VibeEditor Shorts 9:16</span>
            <span class="watermark" id="layoutBadge">Mode : 50/50</span>
        </div>
    </div>

    <script>
        function switchLayout(mode, btnEl) {
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const stage = document.getElementById('splitStage');
            const badge = document.getElementById('layoutBadge');
            const footerMeta = document.getElementById('footerMeta');

            // Reset visibilités
            footerMeta.style.display = 'flex';

            if (mode === '50_50') {
                stage.className = 'split-short-container layout-50-50';
                stage.innerHTML = `
                    <div class="short-pane bg-gradient-top">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>CAMÉRA 01</span></div>
                        <div class="pane-label"><span>Facecam</span>Locuteur Haut</div>
                    </div>
                    <div class="split-divider-h"></div>
                    <div class="short-pane bg-gradient-bottom">
                        <div class="pane-tag alt"><span class="indicator-dot"></span><span>B-ROLL 02</span></div>
                        <div class="pane-label"><span>Illustration</span>Gameplay & Scène Bas</div>
                    </div>
                `;
                badge.textContent = 'Mode : 50/50';
            } 
            else if (mode === 'reaction') {
                stage.className = 'split-short-container layout-reaction';
                stage.innerHTML = `
                    <div class="short-pane bg-gradient-top">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>REACTION CAM</span></div>
                        <div class="pane-label" style="font-size:16px;"><span>38% Hauteur</span>Speaker Focus</div>
                    </div>
                    <div class="split-divider-h"></div>
                    <div class="short-pane bg-gradient-bottom">
                        <div class="pane-tag alt"><span class="indicator-dot"></span><span>SUJET PRINCIPAL</span></div>
                        <div class="pane-label"><span>62% Hauteur</span>Démonstration / Extrait</div>
                    </div>
                `;
                badge.textContent = 'Mode : Réaction (38/62)';
            }
            else if (mode === 'triple') {
                stage.className = 'split-short-container layout-triple';
                stage.innerHTML = `
                    <div class="short-pane bg-gradient-top">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>ÉTAPE 1</span></div>
                        <div class="pane-label" style="font-size:15px;">Intro & Crochet</div>
                    </div>
                    <div class="split-divider-h"></div>
                    <div class="short-pane bg-gradient-third">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>ÉTAPE 2</span></div>
                        <div class="pane-label" style="font-size:15px;">Démonstration Clé</div>
                    </div>
                    <div class="split-divider-h"></div>
                    <div class="short-pane bg-gradient-bottom">
                        <div class="pane-tag alt"><span class="indicator-dot"></span><span>ÉTAPE 3</span></div>
                        <div class="pane-label" style="font-size:15px;">Appel à l'Action</div>
                    </div>
                `;
                badge.textContent = 'Mode : Triple Stack (1/3)';
            }
            else if (mode === 'pip') {
                stage.className = 'split-short-container layout-pip';
                stage.innerHTML = `
                    <div class="short-pane base-fullscreen bg-gradient-bottom">
                        <div class="pane-tag alt"><span class="indicator-dot"></span><span>ARRIÈRE-PLAN PLEIN ÉCRAN</span></div>
                        <div class="pane-label"><span>Écran Total 100%</span>Démonstration Principale</div>
                    </div>
                    <div class="pip-floating-box bg-gradient-top">
                        <div class="pane-tag" style="top:8px; left:8px; font-size:9px; padding:3px 6px;">
                            <span class="indicator-dot"></span><span>PIVOT</span>
                        </div>
                        <div class="pane-label" style="font-size:13px; margin-top:55px;">Facecam Flottante</div>
                    </div>
                `;
                badge.textContent = 'Mode : PiP Flottant';
            }
            // --- NOUVEAU 1 : CÔTE-À-CÔTE (2 COLONNES VERTICALES) ---
            else if (mode === 'side_by_side') {
                stage.className = 'split-short-side-by-side';
                stage.innerHTML = `
                    <div class="col-pane bg-gradient-col1">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>OPTION A</span></div>
                        <div class="pane-label" style="font-size:16px;"><span>Joueur 01</span>Mbappé</div>
                    </div>
                    <div class="split-divider-v"></div>
                    <div class="split-vs-badge">VS</div>
                    <div class="col-pane bg-gradient-col2">
                        <div class="pane-tag alt"><span class="indicator-dot"></span><span>OPTION B</span></div>
                        <div class="pane-label" style="font-size:16px;"><span>Joueur 02</span>Haaland</div>
                    </div>
                `;
                badge.textContent = 'Mode : Côte-à-Côte 9:16 (2 Col)';
            }
            // --- NOUVEAU 2A : EXACT RÉFÉRENCE 1 (split_scrren_short_1.jpg) ---
            else if (mode === 'square_card') {
                stage.className = 'split-short-square-card';
                stage.innerHTML = `
                    <!-- Fond flou d'ambiance plein écran (noir sur la réf) -->
                    <div class="backdrop-blur-video bg-gradient-top"></div>
                    <!-- Vraie vidéo / image dans la card carrée 1:1 arrondie (blanc sur la réf) -->
                    <div class="card-square-content">
                        <div class="short-pane bg-gradient-bottom" style="width:100%; height:100%;">
                            <div class="pane-tag"><span class="indicator-dot"></span><span>CADRE 1:1 CARRÉ</span></div>
                            <div class="pane-label" style="font-size:16px;">
                                <span>Illustration Centrée</span>
                                Format Carré Arrondi (Réf 1)
                            </div>
                        </div>
                    </div>
                `;
                badge.textContent = 'Mode : Card Carrée 1:1 (Réf 1)';
            }
            // --- NOUVEAU 2B : EXACT RÉFÉRENCE 2 (split_scrren_short_2.jpg) ---
            else if (mode === 'blur_card') {
                stage.className = 'split-short-blur-card';
                stage.innerHTML = `
                    <!-- Fond flou d'ambiance plein écran (noir sur la réf) -->
                    <div class="backdrop-blur-video bg-gradient-top"></div>
                    <!-- Vraie vidéo / image dans la card arrondie centrale (blanc sur la réf) -->
                    <div class="card-inset-content">
                        <div class="short-pane bg-gradient-bottom" style="width:100%; height:100%;">
                            <div class="pane-tag"><span class="indicator-dot"></span><span>MÉDIA FOCUS</span></div>
                            <div class="pane-label">
                                <span>Illustration Centrée</span>
                                Vidéo Nette en Lévitation
                            </div>
                        </div>
                    </div>
                `;
                badge.textContent = 'Mode : Fond Flou + Card Flottante (Réf 2)';
            }
            // --- NOUVEAU 3 : EXACT RÉFÉRENCE 3 (split_scrren_short_3.jpg) ---
            else if (mode === 'curved_banner') {
                stage.className = 'split-short-curved-banner';
                stage.innerHTML = `
                    <!-- En-tête sur Fond Blanc -->
                    <div class="banner-header">
                        <span style="font-family:'JetBrains Mono'; font-size:12px; font-weight:700; color:#06b6d4; text-transform:uppercase; letter-spacing:2px;">HOOK CINÉMATIQUE</span>
                        <h2 style="font-size:22px; font-weight:900; color:#090a0f; margin-top:4px; line-height:1.2;">L'ACTION DÉCISIVE</h2>
                    </div>

                    <!-- Bandeau Incurvé Cinéma au Centre (Zone Noire sur la réf) -->
                    <div class="curved-media-viewport">
                        <div class="curved-shape-container bg-gradient-top">
                            <div class="short-pane" style="width:100%; height:100%;">
                                <div class="pane-label">
                                    <span>Cadre Incurvé Anamorphique</span>
                                    Immersion Totale
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pied de page sur Fond Blanc -->
                    <div class="banner-footer">
                        <span style="font-size:14px; font-weight:700; color:#334155;">1080x1920 • Bandeau Incurvé</span>
                        <p style="font-size:12px; color:#64748b; margin-top:2px;">Ombres profondes projetées en haut et en bas</p>
                    </div>
                `;
                badge.textContent = 'Mode : Bandeau Incurvé Cinéma (Réf 3)';
            }
            // --- NOUVEAU 4 : SPLIT SPÉCIAL TUTORIEL EXPRESS (9:16) ---
            else if (mode === 'tutorial_short') {
                stage.className = 'split-short-tutorial';
                stage.innerHTML = `
                    <!-- Haut : Écran de démo app / site web -->
                    <div class="tuto-screen-top bg-gradient-top">
                        <div class="pane-tag"><span class="indicator-dot"></span><span>DÉMONSTRATION EN DIRECT</span></div>
                        <div class="pane-label" style="font-size:17px;">
                            <span>Capture d'écran 62%</span>
                            Interface Logicielle
                        </div>
                    </div>

                    <!-- Bas : Carte explicative des étapes du tutoriel -->
                    <div class="tuto-card-bottom">
                        <div style="display:flex; align-items:center; justify-content:space-between;">
                            <span style="font-family:'JetBrains Mono'; font-size:12px; font-weight:800; color:#00f0ff;">ÉTAPE 01 / 03</span>
                            <span style="font-size:11px; background:rgba(0,240,255,0.15); border:1px solid #00f0ff; color:#00f0ff; padding:2px 8px; border-radius:4px;">SHORT TUTO</span>
                        </div>
                        <h3 style="font-size:16px; font-weight:800; color:#fff; line-height:1.3;">Installer les dépendances et démarrer le serveur</h3>
                        <p style="font-size:12px; color:#94a3b8; font-family:'JetBrains Mono'; background:rgba(0,0,0,0.4); padding:6px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.08);">npm install && npm start</p>
                    </div>
                `;
                badge.textContent = 'Mode : Tutoriel Express 9:16';
            }

            // Animation douce GSAP
            gsap.from(stage.children, {
                opacity: 0.4,
                scale: 0.98,
                duration: 0.35,
                stagger: 0.05,
                ease: 'power2.out'
            });
        }
    </script>
</body>
</html>
