<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Screen Horizontal — Format Long (16:9)</title>
    <!-- GSAP for smooth animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #07090e;
            --accent-cyan: #00f0ff;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-emerald: #10b981;
            --border-glow: rgba(0, 240, 255, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-canvas);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        /* --- TOOLBAR DE CONTRÔLE --- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .toolbar-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            margin-right: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-mode {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 12.5px;
            font-weight: 600;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-mode:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-mode.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.4);
        }

        /* --- STAGE HORIZONTAL 16:9 --- */
        .stage-wrapper {
            position: relative;
            width: 1024px;
            height: 576px; /* Ratio 16:9 fidèle (1920x1080 normalisé) */
            max-width: 95vw;
            background: #000000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        /* Container Split */
        .split-long-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            overflow: hidden;
            background: #000000;
        }

        /* Panneaux horizontaux */
        .long-pane {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: flex 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .long-pane img,
        .long-pane video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Dégradés d'arrière-plan */
        .bg-gradient-left {
            background: radial-gradient(circle at 30% 50%, #1e3a8a 0%, #030712 100%);
        }
        .bg-gradient-right {
            background: radial-gradient(circle at 70% 50%, #581c87 0%, #030712 100%);
        }
        .bg-gradient-alt1 {
            background: radial-gradient(circle at 50% 50%, #064e3b 0%, #030712 100%);
        }
        .bg-gradient-alt2 {
            background: radial-gradient(circle at 50% 50%, #7c2d12 0%, #030712 100%);
        }

        /* Séparateur Vertical (Divider) */
        .split-divider-v {
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, transparent 0%, var(--accent-cyan) 50%, transparent 100%);
            box-shadow: 0 0 15px var(--accent-cyan);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        /* Séparateur Horizontal pour sous-colonnes */
        .split-divider-h {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--accent-cyan) 50%, transparent 100%);
            box-shadow: 0 0 15px var(--accent-cyan);
            position: relative;
            z-index: 20;
            flex-shrink: 0;
        }

        /* Badges informatifs */
        .pane-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.8px;
            z-index: 10;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .pane-badge .status-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 10px var(--accent-emerald);
        }

        .pane-badge.alt .status-pulse {
            background: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple);
        }

        .pane-badge.rec .status-pulse {
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Titre narratif centré */
        .pane-caption {
            position: relative;
            z-index: 5;
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9);
            padding: 0 30px;
        }

        .pane-caption span {
            font-size: 12px;
            display: block;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        /* --- 1. LAYOUT 50 / 50 (Gauche / Droite) --- */
        .layout-50-50 {
            flex-direction: row;
        }
        .layout-50-50 .long-pane {
            flex: 1;
        }

        /* --- 2. LAYOUT FOCUS 70 / 30 --- */
        .layout-focus-70 {
            flex-direction: row;
        }
        .layout-focus-70 .long-pane:nth-child(1) {
            flex: 1.4;
        }
        .layout-focus-70 .long-pane:nth-child(3) {
            flex: 0.6;
        }

        /* --- 3. LAYOUT TRIPLE (1 Main + 2 Stacked) --- */
        .layout-triple {
            flex-direction: row;
        }
        .layout-triple .main-column {
            flex: 1.3;
            height: 100%;
            position: relative;
        }
        .layout-triple .side-column {
            flex: 0.7;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .layout-triple .side-column .long-pane {
            flex: 1;
        }

        /* --- 4. LAYOUT QUAD (4 Écrans 2x2) --- */
        .layout-quad {
            display: grid !important;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 3px;
            background: var(--accent-cyan);
        }
        .layout-quad .long-pane {
            background: #0b0f19;
            width: 100%;
            height: 100%;
        }

        /* Badge Versus au centre */
        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #000000;
            border: 2px solid var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            z-index: 40;
        }

        /* Footer Meta */
        .long-footer-meta {
            position: absolute;
            bottom: 18px;
            left: 20px;
            right: 20px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            pointer-events: none;
        }

        .meta-pill {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

    <!-- SÉLECTEUR DE MODE SPLIT LONG -->
    <div class="toolbar">
        <span class="toolbar-title">🖥️ LONG (16:9) :</span>
        <button class="btn-mode active" onclick="switchLongLayout('50_50', this)">50 / 50 Face-à-Face</button>
        <button class="btn-mode" onclick="switchLongLayout('focus_70', this)">Focus 70 / 30</button>
        <button class="btn-mode" onclick="switchLongLayout('triple', this)">Triple Cam (1 + 2)</button>
        <button class="btn-mode" onclick="switchLongLayout('quad', this)">Quad Grid (2 × 2)</button>
    </div>

    <!-- ZONE DE RENDU HORIZONTALE (16:9) -->
    <div class="stage-wrapper">
        <div id="splitLongStage" class="split-long-container layout-50-50">
            <!-- Panneau Gauche -->
            <div class="long-pane bg-gradient-left">
                <div class="pane-badge">
                    <span class="status-pulse"></span>
                    <span>SUJET A (AVANT)</span>
                </div>
                <div class="pane-caption">
                    <span>Perspective 01</span>
                    Situation Initiale
                </div>
            </div>

            <!-- Divider Central -->
            <div class="split-divider-v"></div>
            <div class="vs-badge" id="vsBadge">VS</div>

            <!-- Panneau Droit -->
            <div class="long-pane bg-gradient-right">
                <div class="pane-badge alt">
                    <span class="status-pulse"></span>
                    <span>SUJET B (APRÈS)</span>
                </div>
                <div class="pane-caption">
                    <span>Perspective 02</span>
                    Solution & Résultat
                </div>
            </div>
        </div>

        <div class="long-footer-meta">
            <span class="meta-pill">VibeEditor Long-Form 16:9</span>
            <span class="meta-pill" id="longLayoutBadge">Mode : 50/50 Face-à-Face</span>
        </div>
    </div>

    <script>
        function switchLongLayout(mode, btnEl) {
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            const stage = document.getElementById('splitLongStage');
            const badge = document.getElementById('longLayoutBadge');

            if (mode === '50_50') {
                stage.className = 'split-long-container layout-50-50';
                stage.innerHTML = `
                    <div class="long-pane bg-gradient-left">
                        <div class="pane-badge"><span class="status-pulse"></span><span>CAMÉRA GAUCHE</span></div>
                        <div class="pane-caption"><span>Intervenant 01</span>Expertise & Analyse</div>
                    </div>
                    <div class="split-divider-v"></div>
                    <div class="vs-badge">VS</div>
                    <div class="long-pane bg-gradient-right">
                        <div class="pane-badge alt"><span class="status-pulse"></span><span>CAMÉRA DROITE</span></div>
                        <div class="pane-caption"><span>Intervenant 02</span>Contre-Argumentation</div>
                    </div>
                `;
                badge.textContent = 'Mode : 50/50 Face-à-Face';
            } 
            else if (mode === 'focus_70') {
                stage.className = 'split-long-container layout-focus-70';
                stage.innerHTML = `
                    <div class="long-pane bg-gradient-left">
                        <div class="pane-badge rec"><span class="status-pulse"></span><span>DÉMONSTRATION 70%</span></div>
                        <div class="pane-caption"><span>Contenu Principal</span>Graphiques & Vidéo B-Roll</div>
                    </div>
                    <div class="split-divider-v"></div>
                    <div class="long-pane bg-gradient-right">
                        <div class="pane-badge"><span class="status-pulse"></span><span>SPEAKER 30%</span></div>
                        <div class="pane-caption" style="font-size:18px;"><span>Facecam</span>Présentateur</div>
                    </div>
                `;
                badge.textContent = 'Mode : Focus 70/30';
            }
            else if (mode === 'triple') {
                stage.className = 'split-long-container layout-triple';
                stage.innerHTML = `
                    <div class="main-column long-pane bg-gradient-left">
                        <div class="pane-badge rec"><span class="status-pulse"></span><span>VUE PRINCIPALE</span></div>
                        <div class="pane-caption"><span>Direct 65%</span>Événement Majeur</div>
                    </div>
                    <div class="split-divider-v"></div>
                    <div class="side-column">
                        <div class="long-pane bg-gradient-alt1">
                            <div class="pane-badge"><span class="status-pulse"></span><span>DONNÉES A</span></div>
                            <div class="pane-caption" style="font-size:16px;">Statistiques Clés</div>
                        </div>
                        <div class="split-divider-h"></div>
                        <div class="long-pane bg-gradient-alt2">
                            <div class="pane-badge alt"><span class="status-pulse"></span><span>DONNÉES B</span></div>
                            <div class="pane-caption" style="font-size:16px;">Réactions Directes</div>
                        </div>
                    </div>
                `;
                badge.textContent = 'Mode : Triple Cam (1 + 2)';
            }
            else if (mode === 'quad') {
                stage.className = 'split-long-container layout-quad';
                stage.innerHTML = `
                    <div class="long-pane bg-gradient-left">
                        <div class="pane-badge"><span class="status-pulse"></span><span>CAM 01</span></div>
                        <div class="pane-caption" style="font-size:16px;">Angle Face</div>
                    </div>
                    <div class="long-pane bg-gradient-right">
                        <div class="pane-badge alt"><span class="status-pulse"></span><span>CAM 02</span></div>
                        <div class="pane-caption" style="font-size:16px;">Angle Profil</div>
                    </div>
                    <div class="long-pane bg-gradient-alt1">
                        <div class="pane-badge"><span class="status-pulse"></span><span>CAM 03</span></div>
                        <div class="pane-caption" style="font-size:16px;">Démonstration Écran</div>
                    </div>
                    <div class="long-pane bg-gradient-alt2">
                        <div class="pane-badge rec"><span class="status-pulse"></span><span>CAM 04</span></div>
                        <div class="pane-caption" style="font-size:16px;">Tableau & Synthèse</div>
                    </div>
                `;
                badge.textContent = 'Mode : Quad Grid (2 × 2)';
            }

            // Animation douce GSAP
            gsap.from(stage.children, {
                opacity: 0.35,
                scale: 0.98,
                duration: 0.35,
                stagger: 0.05,
                ease: 'power2.out'
            });
        }
    </script>
</body>
</html>
