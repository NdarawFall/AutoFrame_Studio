<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composant — Split-Screen Horizontal 16:9 (Règles #8 & #18)</title>
    <link rel="stylesheet" href="../shadcn.css">
    <script src="../../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            font-family: 'Inter', system-ui, sans-serif;
            color: #fff;
        }

        /* 1. Moitié Gauche : Sujet / Locuteur ou Vidéo B-Roll */
        .left-half {
            width: 50%;
            height: 100%;
            position: relative;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-subject {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #6366f1 0%, #4338ca 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            box-shadow: 0 0 60px rgba(99, 102, 241, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.2);
        }

        .subject-tag {
            position: absolute;
            bottom: 32px;
            left: 32px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* 2. Moitié Droite : Arrière-plan flouté & assombri (Backdrop Blur) */
        .right-half {
            width: 50%;
            height: 100%;
            position: relative;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(28px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Marges latérales rigoureusement égales (Règle #18) */
            padding: 0 64px;
            gap: 28px;
        }

        .content-box {
            opacity: 0;
            transform: translateX(30px);
        }

        .headline {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.025em;
            margin: 0 0 12px 0;
        }

        .subtext {
            font-size: 1.05rem;
            color: #a1a1aa;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        /* Carte UI animée dans l'espace réservé */
        .ui-metric-card {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>

    <!-- Moitié Gauche : Sujet -->
    <div class="left-half">
        <div class="avatar-subject">👨‍💻</div>
        <div class="subject-tag">Intervenant • Caméra 1</div>
    </div>

    <!-- Moitié Droite : Fond flouté avec marges égales et contenu -->
    <div class="right-half">
        <div id="content" class="content-box">
            <span class="badge badge-primary" style="margin-bottom:12px;">Règle #8 & #18 • Split-Screen</span>
            <h2 class="headline">Le Pouvoir de l'Espace Négatif</h2>
            <p class="subtext">
                En isolant le sujet d'un côté et en appliquant un flou d'arrière-plan de l'autre, vous créez un contraste optique maximal.
            </p>

            <div class="ui-metric-card">
                <div>
                    <div style="font-size:0.8125rem; color:#a1a1aa;">Taux de Rétention Vidéo</div>
                    <div style="font-size:1.8rem; font-weight:800; color:#22c55e;">+48.6%</div>
                </div>
                <div style="font-size:2rem;">📈</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            gsap.to("#content", {
                opacity: 1,
                x: 0,
                duration: 0.8,
                delay: 0.3,
                ease: "power3.out"
            });
        });
    </script>
</body>
</html>
