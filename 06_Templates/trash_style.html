<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Template Trash Style // Montage Chaotique, Grunge & Ripped Collage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-punk: 'Bebas Neue', Impact, sans-serif;
            --font-bold: 'Montserrat', sans-serif;
            --accent-neon: #e11d48;
            --accent-yellow: #facc15;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font-bold); color: #fff; }
        #stage {
            width: 1920px;
            height: 1080px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #09090b;
        }
        .trash-grid {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(225, 29, 72, 0.15) 0%, rgba(0,0,0,0.95) 80%);
        }
        .paper-cutout-wrap {
            position: absolute;
            width: 800px;
            height: 800px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-3deg);
            background: #18181b;
            border: 4px solid #ffffff;
            box-shadow: 15px 15px 0px var(--accent-neon);
            overflow: hidden;
        }
        .paper-cutout-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.3) grayscale(0.2);
        }
        .tape-strip {
            position: absolute;
            width: 160px;
            height: 42px;
            background: rgba(250, 204, 21, 0.85);
            backdrop-filter: blur(4px);
            transform: rotate(-15deg);
            top: -15px;
            left: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .headline-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) rotate(2deg);
            background: #000000;
            border: 3px solid #ffffff;
            padding: 12px 36px;
            box-shadow: 8px 8px 0px var(--accent-yellow);
            z-index: 20;
        }
        .headline-text {
            font-family: var(--font-punk);
            font-size: 68px;
            letter-spacing: 2px;
            color: #ffffff;
            line-height: 1;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="stage" data-duration="30.0" data-width="1920" data-height="1080">
        <div class="trash-grid"></div>
        <div class="paper-cutout-wrap" id="cutoutWrap">
            <div class="tape-strip"></div>
            <img class="paper-cutout-img" id="mainMediaImg" src="../01_Assets/Images/styles/style_trash_style.jpg" alt="Trash Collage">
        </div>
        <div class="headline-bar" id="headlineBar">
            <h1 class="headline-text" id="stageTitle">TRASH STYLE // PUNK EDIT</h1>
        </div>
    </div>
    <script>
        const isIframeMode = window.self !== window.top;
        const tl = gsap.timeline({ paused: isIframeMode });
        tl.from('#cutoutWrap', { duration: 0.7, scale: 1.3, rotation: 12, opacity: 0, ease: 'rough' })
          .from('#headlineBar', { duration: 0.5, y: 100, rotation: -8, opacity: 0, ease: 'back.out(2)' }, '-=0.3');
        window.tl = tl;
        window.__timeline = {
            duration: () => 30.0,
            seek: (t) => tl.seek(t, false),
            pause: () => tl.pause(),
            play: () => tl.play()
        };
    </script>
</body>
</html>
