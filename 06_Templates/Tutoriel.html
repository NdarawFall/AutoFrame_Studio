<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Template Tutoriel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #stage {
            width: 1920px;
            height: 1080px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #18181b;
        }
    </style>
</head>
<body>
    <div id="stage" data-duration="30.0" data-width="1920" data-height="1080">
        <!-- Contenu du Template Tutoriel -->
    </div>
    <script>
        const isIframeMode = window.self !== window.top;
        const tl = gsap.timeline({ paused: isIframeMode });
        window.tl = tl;
        window.__timeline = {
            duration: () => 30.0,
            seek: (t) => tl.seek(t, false),
            pause: () => tl.pause(),
            play: () => tl.play()
        };
    </script>
</body>
</html>
