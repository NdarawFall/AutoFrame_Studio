<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Template 2D Explainer // Motion Infographique & Animation Vectorielle</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-title: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --accent-teal: #14b8a6;
            --accent-purple: #8b5cf6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font-body); color: #fff; }
        #stage {
            width: 1920px;
            height: 1080px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vector-shapes-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 75% 25%, rgba(139, 92, 246, 0.12) 0%, transparent 55%),
                        radial-gradient(circle at 25% 75%, rgba(20, 184, 166, 0.12) 0%, transparent 55%);
        }
        .explainer-container {
            width: 1460px;
            height: 760px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 10;
        }
        .left-visual-card {
            width: 100%;
            height: 580px;
            border-radius: 20px;
            background: rgba(22, 27, 34, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .explainer-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }
        .right-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .category-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 14px;
            border-radius: 6px;
            background: rgba(20, 184, 166, 0.15);
            border: 1px solid rgba(20, 184, 166, 0.4);
            color: #2dd4bf;
            width: fit-content;
        }
        .explainer-title {
            font-family: var(--font-title);
            font-size: 54px;
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .explainer-desc {
            font-size: 20px;
            line-height: 1.55;
            color: rgba(255, 255, 255, 0.75);
        }
    </style>
</head>
<body>
    <div id="stage" data-duration="30.0" data-width="1920" data-height="1080">
        <div class="vector-shapes-bg"></div>
        <div class="explainer-container">
            <div class="left-visual-card" id="explainerCard">
                <img class="explainer-img" id="mainMediaImg" src="../01_Assets/Images/styles/style_2d_explainer.jpg" alt="2D Explainer Motion">
            </div>
            <div class="right-content" id="explainerText">
                <span class="category-pill">Explication Visuelle</span>
                <h1 class="explainer-title" id="stageTitle">Comprendre en un coup d'œil</h1>
                <p class="explainer-desc">Animation 2D pédagogique, schématisation d'idées complexes et mise en scène graphique fluide.</p>
            </div>
        </div>
    </div>
    <script>
        const isIframeMode = window.self !== window.top;
        const tl = gsap.timeline({ paused: isIframeMode });
        tl.from('#explainerCard', { duration: 1, x: -60, opacity: 0, ease: 'power3.out' })
          .from('#explainerText', { duration: 0.8, x: 50, opacity: 0, ease: 'power2.out' }, '-=0.6');
        window.tl = tl;
        window.__timeline = {
            duration: () => 30.0,
            seek: (t) => tl.seek(t, false),
            pause: () => tl.pause(),
            play: () => tl.play()
        };
    </script>
</body>
</html>
